<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reconhecimento · V1 e V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&display=block" rel="stylesheet">
<style>
/* ---------- Tokens (mesmo sistema da documentação do login) ---------- */
:root{
  color-scheme:light;
  --verde:#338449; --verde-esc:#276638;
  --pagina:#E4E8E5; --card:#FFFFFF; --borda:#E1E5E2; --divisor:#EEF0EF;
  --tinta:#111513; --tinta-2:#3E4541; --tinta-3:#545C57; --tinta-4:#9AA29D; --grupo:#6A726D;
  --hover:#F6F7F6; --num:#F2F4F3; --atual:#EAF4ED; --botao-borda:#C9D0CB;
  --nota-borda:#F1CFA0; --nota-tinta:#8A5300; --nota-info:#BBDBC5;
  --aparelho:#101312;
  --w:360px; --h:780px;
}

*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;background:var(--pagina);color:var(--tinta);font-family:Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;padding:0;color:inherit;-webkit-tap-highlight-color:transparent}
.ms{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;line-height:1;letter-spacing:normal;text-transform:none;white-space:nowrap;direction:ltr;-webkit-font-smoothing:antialiased;font-variation-settings:"FILL" 0,"wght" 400,"GRAD" 0,"opsz" 24;user-select:none}

/* ---------- Palco: lista | celular | passos ---------- */
.palco{height:100vh;display:grid;grid-template-columns:minmax(230px,300px) auto minmax(230px,300px);gap:clamp(28px,4vw,64px);place-content:safe center;align-items:start;padding:16px;overflow:auto}
.lateral{max-height:calc(100vh - 32px);overflow-y:auto;padding:3px;scrollbar-width:thin;scrollbar-color:var(--botao-borda) transparent}

.titulo-doc{margin:0 6px 18px}
.titulo-doc h1{margin:0;font-size:17px;line-height:22px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.titulo-doc p{margin:4px 0 0;font-size:12.5px;line-height:17px;color:var(--tinta-3);text-wrap:pretty}
/* troca entre as duas documentações */
.docs{display:flex;gap:4px;margin-top:12px;padding:3px;border:1px solid var(--borda);background:var(--card);border-radius:12px;width:max-content;max-width:100%}
.docs a{font-size:12.5px;line-height:16px;font-weight:800;color:var(--tinta-3);text-decoration:none;padding:6px 10px;border-radius:9px;white-space:nowrap}
.docs a:hover{background:var(--hover)}
.docs a[aria-current="page"]{background:var(--verde);color:#fff}
.docs a:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

.grupo{margin:16px 6px 6px;font-size:11px;line-height:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grupo)}
.lista-fluxos{border:1px solid var(--borda);background:var(--card);border-radius:16px;overflow:hidden}
.fluxo{width:100%;min-height:44px;text-align:left;border:0;background:transparent;padding:10px 12px;display:flex;gap:10px;align-items:center;color:var(--tinta);font-size:13.5px;line-height:18px;font-weight:700}
.fluxo + .fluxo{border-top:1px solid var(--divisor)}
.fluxo:hover{background:var(--hover)}
.fluxo .num{flex-shrink:0;width:22px;height:22px;border-radius:11px;background:var(--num);color:var(--tinta-2);font-size:11.5px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.fluxo .num .ms{font-size:14px}
.fluxo[aria-current="true"]{background:var(--atual);color:var(--verde-esc);font-weight:800}
.fluxo[aria-current="true"] .num{background:var(--verde);color:#fff}

.telas-fluxo{border:1px solid var(--borda);background:var(--card);border-radius:18px;padding:14px 8px 8px}
.telas-fluxo .tag{display:inline-flex;margin:0 8px 6px;font-size:10.5px;line-height:14px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--verde-esc);background:var(--atual);border-radius:6px;padding:2px 6px}
.telas-fluxo h2{margin:0 8px;font-size:16px;line-height:21px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.telas-fluxo .desc{margin:4px 8px 10px;font-size:12.5px;line-height:17px;color:var(--tinta-3);text-wrap:pretty}
.passos{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.passo{width:100%;text-align:left;border:0;background:transparent;border-radius:10px;padding:6px 8px;display:flex;gap:10px;align-items:center;font-size:13px;line-height:18px;font-weight:600;color:var(--tinta-2)}
.passo:hover{background:var(--num)}
.passo .n{flex-shrink:0;width:20px;height:20px;border-radius:10px;background:var(--num);color:var(--grupo);font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}
.passo[aria-current="step"]{background:var(--atual);color:var(--verde-esc);font-weight:800}
.passo[aria-current="step"] .n{background:var(--verde);color:#fff}
.fluxo:focus-visible,.passo:focus-visible,.simular button:focus-visible{outline:2px solid var(--verde);outline-offset:-2px}
.cen{margin:8px 8px 4px;padding-top:10px;border-top:1px solid var(--divisor);font-size:12.5px;line-height:17px;color:var(--tinta-3)}
.cen b{color:var(--tinta);font-variant-numeric:tabular-nums}

/* ---------- Centro: abas V1 / V2 ---------- */
.centro{display:flex;flex-direction:column;align-items:center;gap:12px}
.versao{display:flex;gap:4px;padding:4px;border:1px solid var(--borda);background:var(--card);border-radius:14px}
.versao button{height:36px;padding:0 16px;border:0;border-radius:10px;background:transparent;color:var(--tinta-3);font:800 13.5px Manrope,sans-serif;display:inline-flex;align-items:center;gap:4px}
.versao button span{font-weight:600}
.versao button:hover{background:var(--hover)}
.versao button[aria-selected="true"]{background:var(--verde);color:#fff}
.versao button:focus-visible{outline:2px solid var(--verde);outline-offset:2px}

/* ---------- Centro: celular ---------- */
.moldura{position:relative;width:calc((var(--w) + 24px) * var(--s,1));height:calc((var(--h) + 24px) * var(--s,1))}
.aparelho{position:absolute;left:0;top:0;width:calc(var(--w) + 24px);height:calc(var(--h) + 24px);padding:12px;border-radius:54px;background:var(--aparelho);
  box-shadow:inset 0 0 0 1px #2A2F2C,0 30px 80px rgba(16,24,19,.28),0 6px 18px rgba(16,24,19,.18);transform:scale(var(--s,1));transform-origin:0 0}
.raiz{position:relative;width:var(--w);height:var(--h);border-radius:42px;overflow:hidden;background:#EFF1F2;isolation:isolate}
.raiz iframe{display:block;width:100%;height:100%;border:0}
.raiz iframe[hidden]{display:none}
.camera{position:absolute;z-index:71;left:50%;top:15px;width:11px;height:11px;margin-left:-5.5px;border-radius:50%;background:#050706;pointer-events:none}
.gestos{position:absolute;z-index:71;left:50%;bottom:8px;width:108px;height:4px;margin-left:-54px;border-radius:2px;background:rgba(17,21,19,.85);pointer-events:none}

.simular{width:100%;max-width:480px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:36px}
.simular .rot{width:100%;text-align:center;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--grupo)}
.simular button{height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--botao-borda);background:var(--card);color:var(--tinta);font:700 13.5px Manrope,sans-serif;display:inline-flex;align-items:center;gap:6px}
.simular button.destaque{background:var(--verde);border-color:var(--verde);color:#fff}
.simular button .ms{font-size:18px}
.simular[hidden]{display:none}

.nota-ux{width:100%;max-width:440px;position:relative;margin-top:4px;border-radius:16px;background:var(--card);border:1px solid var(--nota-borda);padding:10px 14px 11px;box-shadow:0 6px 18px rgba(17,21,19,.06)}
.nota-ux::before{content:"";position:absolute;top:-7px;left:50%;width:12px;height:12px;margin-left:-6px;background:var(--card);border-left:1px solid var(--nota-borda);border-top:1px solid var(--nota-borda);transform:rotate(45deg)}
.nota-ux .rot{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;font-weight:800;color:var(--nota-tinta)}
.nota-ux .rot .ms{font-size:16px}
.nota-ux p{margin:4px 0 0;font-size:12.5px;line-height:17px;color:var(--tinta-2);text-wrap:pretty}
.nota-ux[data-tipo="info"]{border-color:var(--nota-info)}
.nota-ux[data-tipo="info"]::before{border-color:var(--nota-info)}
.nota-ux[data-tipo="info"] .rot{color:var(--verde-esc)}
.nota-ux[hidden]{display:none}

/* ---------- Centro: documento (considerações) ---------- */
.doc{width:calc((var(--w) + 84px) * var(--s,1));max-width:100%;height:calc((var(--h) + 24px) * var(--s,1) + 198px);overflow-y:auto;border:1px solid var(--borda);background:var(--card);border-radius:24px;padding:22px 24px 28px;scrollbar-width:thin;scrollbar-color:var(--botao-borda) transparent}
.doc[hidden]{display:none}
.doc h2{margin:0;font-size:19px;line-height:24px;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.doc .lead{margin:6px 0 0;font-size:13px;line-height:19px;color:var(--tinta-3);text-wrap:pretty}
.doc h3{margin:24px 0 8px;font-size:14px;line-height:19px;font-weight:800;scroll-margin-top:12px}
.doc p{font-size:13px;line-height:19px;color:var(--tinta-2);text-wrap:pretty}
.doc ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:7px}
.doc li{font-size:13px;line-height:19px;color:var(--tinta-2);text-wrap:pretty}
.doc li::marker{color:var(--tinta-4)}
.doc li b,.doc p b{color:var(--tinta)}
.doc table{width:100%;border-collapse:collapse;font-size:12.5px;line-height:17px}
.doc th{text-align:left;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--grupo);padding:8px 8px 6px;border-bottom:1px solid var(--borda)}
.doc td{padding:9px 8px;border-bottom:1px solid var(--divisor);color:var(--tinta-2);vertical-align:top}
.doc td:first-child{font-weight:700;color:var(--tinta)}
.doc tr:last-child td{border-bottom:0}
.doc .fora td{color:var(--tinta-4)}
.doc .pill{display:inline-flex;font-size:11px;font-weight:800;padding:1px 7px;border-radius:6px;background:var(--atual);color:var(--verde-esc)}

@media (max-width:980px){
  .palco{height:auto;overflow:visible;grid-template-columns:minmax(0,1fr);justify-items:center;padding:16px 16px 32px}
  .lateral{width:100%;max-width:460px;max-height:none;overflow:visible}
  .lateral.esq{order:3}
  .centro{order:1}
  .lateral.dir{order:2}
  .doc{width:100%;height:auto;max-height:none}
}
@media (max-height:760px){
  .fluxo{min-height:38px;padding:8px 12px}
  .grupo{margin-top:12px}
  .passo{padding:4px 8px}
}
</style>
</head>
<body>
<main class="palco">
  <aside class="lateral esq" aria-label="Fluxos">
    <div class="titulo-doc">
      <h1>Reconhecimento no app do licenciado</h1>
      <p>Duas propostas pra levar ao app o que o escritório virtual já mostra. Números de exemplo.</p>
      <nav class="docs" aria-label="Documentações">
        <a href="documentacao.html" aria-current="page">Reconhecimento</a>
        <a href="../minha-jornada/documentacao-jornada.html">Minha jornada</a>
      </nav>
    </div>
    <nav id="lista"></nav>
  </aside>

  <section class="centro" aria-label="Protótipo">
    <div class="versao" role="tablist" aria-label="Proposta">
      <button type="button" role="tab" data-versao="v1" aria-selected="true">Versão 1</button>
      <button type="button" role="tab" data-versao="v2" aria-selected="false">Versão 2</button>
    </div>
    <div class="moldura" id="moldura">
      <div class="aparelho">
        <div class="raiz">
          <iframe id="f-v1" title="Protótipo V1"></iframe>
          <iframe id="f-v2" title="Protótipo V2" hidden></iframe>
          <span class="camera" aria-hidden="true"></span>
          <span class="gestos" aria-hidden="true"></span>
        </div>
      </div>
    </div>
    <article class="doc" id="doc" hidden></article>

    <div class="simular" id="simular">
      <span class="rot">Simular</span>
      <button type="button" data-cen="dias" data-v="andamento" class="destaque" title="Dias qualificados em andamento"><span class="ms">schedule</span>62 de 90 dias</button>
      <button type="button" data-cen="dias" data-v="batida" title="Meta de 90 dias batida"><span class="ms">task_alt</span>Meta batida</button>
      <button type="button" data-cen="pro" data-v="sem" class="destaque"><span class="ms">do_not_disturb_on</span>Sem PRO 360</button>
      <button type="button" data-cen="pro" data-v="pro"><span class="ms">workspace_premium</span>PRO 360</button>
      <button type="button" id="recomecar"><span class="ms">replay</span>Recomeçar</button>
    </div>

    <div class="nota-ux" id="nota" aria-live="polite">
      <div class="rot"><span class="ms" id="nota-ic">lightbulb</span><span id="nota-rot">Decisão de desenho</span></div>
      <p id="nota-p"></p>
    </div>
  </section>

  <aside class="lateral dir" aria-label="Telas do fluxo">
    <div class="telas-fluxo">
      <span class="tag" id="tf-tag"></span>
      <h2 id="tf-titulo"></h2>
      <p class="desc" id="tf-desc"></p>
      <ol class="passos" id="tf-passos"></ol>
      <div class="cen" id="tf-cen"></div>
    </div>
  </aside>
</main>

/* ---------- Estado ---------- */
const $ = s => document.querySelector(s);
const frames = { v1: $('#f-v1'), v2: $('#f-v2') };
const pronto = { v1:false, v2:false };
const cen = { dias:'andamento', pro:'sem' };
let atual = null, passoAtual = 0, versao = 'v1';

function enviar(proto, msg){ if (pronto[proto]) frames[proto].contentWindow.postMessage({ type:'proto', ...msg }, '*'); }
function enviarAmbos(msg){ enviar('v1', msg); enviar('v2', msg); }

/* ---------- Lista da esquerda: só a versão escolhida, mais as considerações ---------- */
const daVersao = f => !(f.versao || f.proto) || (f.versao || f.proto) === versao;
function renderLista(){
  let html = '', aberto = false, n = 0;
  FLUXOS.filter(daVersao).forEach(f => {
    if (f.grupo){
      if (aberto) html += '</div>';
      html += `<div class="grupo">${f.grupo}</div><div class="lista-fluxos">`;
      aberto = true; return;
    }
    n++;
    const marca = f.icon ? `<span class="ms">${f.icon}</span>` : n;
    html += `<button type="button" class="fluxo" data-fluxo="${f.id}"><span class="num">${marca}</span>${f.titulo}</button>`;
  });
  if (aberto) html += '</div>';
  $('#lista').innerHTML = html;
}

/* ---------- Abrir fluxo e passo ---------- */
function marcarVersao(){
  document.querySelectorAll('[data-versao]').forEach(b => b.setAttribute('aria-selected', b.dataset.versao === versao));
}
function abrirFluxo(id, passo = 0){
  atual = FLUXOS.find(f => f.id === id) || FLUXOS.find(f => f.id);
  if (atual.proto && atual.proto !== versao){ versao = atual.proto; renderLista(); }
  marcarVersao();
  document.querySelectorAll('.fluxo').forEach(b => b.setAttribute('aria-current', b.dataset.fluxo === atual.id));
  $('#tf-tag').textContent = atual.tag;
  $('#tf-titulo').textContent = atual.titulo;
  $('#tf-desc').textContent = atual.desc;
  $('#tf-passos').innerHTML = atual.passos.map((p, i) =>
    `<li><button type="button" class="passo" data-passo="${i}"><span class="n">${i + 1}</span>${p.t}</button></li>`).join('');

  const ehDoc = !!atual.doc;
  $('#moldura').hidden = ehDoc;
  $('#doc').hidden = !ehDoc;
  $('#simular').hidden = ehDoc;
  $('#nota').hidden = ehDoc;
  if (ehDoc){ $('#doc').innerHTML = atual.doc; $('#doc').scrollTop = 0; }
  else Object.entries(frames).forEach(([k, f]) => { f.hidden = atual.proto !== k; });
  atualizarCenario();
  if (location.hash.slice(1) !== atual.id) history.replaceState(null, '', '#' + atual.id);
  irPasso(passo);
}

function marcarPasso(){
  document.querySelectorAll('.passo').forEach(b => {
    if (+b.dataset.passo === passoAtual) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current');
  });
}

function mostrarNota(n){
  if (!n) return;
  const info = n.tipo === 'info';
  $('#nota').dataset.tipo = info ? 'info' : '';
  $('#nota-ic').textContent = info ? 'lightbulb' : 'help';
  $('#nota-rot').textContent = info ? 'Decisão de desenho' : 'A validar';
  $('#nota-p').textContent = n.p;
}

function irPasso(i){
  passoAtual = i;
  const p = atual.passos[i];
  marcarPasso();
  if (atual.doc){
    const alvo = document.getElementById(p.a);
    if (alvo) $('#doc').scrollTo({ top: alvo.offsetTop - 16, behavior: 'smooth' });
    return;
  }
  silencioAte = performance.now() + 1200; // deixa o protótipo terminar de rolar antes de ouvir a posição
  enviar(atual.proto, p.cmd);
  mostrarNota(p.nota);
}

/* O protótipo avisa onde está; o passo correspondente acende */
const bate = (match, s) => match && Object.entries(match).every(([k, v]) => s[k] === v);
let silencioAte = 0;
window.addEventListener('message', e => {
  const s = e.data;
  if (!s || s.type !== 'proto-state' || !atual || atual.proto !== s.proto) return;
  if (performance.now() < silencioAte) return;
  if (bate(atual.passos[passoAtual].match, s)) return;
  if (atual.passos[passoAtual].match === null && s.sheet === 'atual') return;
  const i = atual.passos.findIndex(p => bate(p.match, s));
  if (i >= 0 && i !== passoAtual){ passoAtual = i; marcarPasso(); mostrarNota(atual.passos[i].nota); }
});

/* ---------- Simular (cenários valem pras duas propostas) ---------- */
function atualizarCenario(){
  document.querySelectorAll('[data-cen]').forEach(b => b.classList.toggle('destaque', cen[b.dataset.cen] === b.dataset.v));
  const dias = cen.dias === 'batida' ? '195 dias, meta batida' : '62 de 90 dias';
  const pro = cen.pro === 'pro' ? 'PRO 360 garantido' : 'sem PRO 360';
  $('#tf-cen').innerHTML = atual && atual.doc
    ? 'Vale pras duas propostas.'
    : `Cenário: <b>Gestor</b> · ${pro} · ${dias}`;
}
document.addEventListener('click', e => {
  const v = e.target.closest('[data-versao]');
  if (v){
    versao = v.dataset.versao;
    renderLista();
    return abrirFluxo(FLUXOS.find(f => f.proto === versao).id);
  }
  const f = e.target.closest('[data-fluxo]');
  if (f) return abrirFluxo(f.dataset.fluxo);
  const p = e.target.closest('[data-passo]');
  if (p) return irPasso(+p.dataset.passo);
  const c = e.target.closest('[data-cen]');
  if (c){
    cen[c.dataset.cen] = c.dataset.v;
    enviarAmbos({ action:'set', ctl:c.dataset.cen, v:c.dataset.v });
    return atualizarCenario();
  }
  if (e.target.closest('#recomecar')){
    cen.dias = 'andamento'; cen.pro = 'sem';
    enviarAmbos({ action:'set', ctl:'dias', v:'andamento' });
    enviarAmbos({ action:'set', ctl:'pro', v:'sem' });
    atualizarCenario();
    irPasso(0);
  }
});

/* Quando cada protótipo avisa que está pronto, recebe o cenário e o passo atual */
window.addEventListener('message', e => {
  const m = e.data;
  if (!m || m.type !== 'proto-ready' || !frames[m.proto]) return;
  const k = m.proto;
  pronto[k] = true;
  enviar(k, { action:'set', ctl:'dias', v:cen.dias });
  enviar(k, { action:'set', ctl:'pro', v:cen.pro });
  if (atual && atual.proto === k) enviar(k, atual.passos[passoAtual].cmd);
});

/* Os dois protótipos moram dentro deste arquivo (bloco PROTOS, no fim),
   pra documentação abrir sozinha em qualquer lugar */
const decodificar = b64 => new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0)));
Object.entries(frames).forEach(([k, f]) => { f.srcdoc = decodificar(PROTO_SRC[k]); });

/* ---------- Escala do celular pra caber na tela ---------- */
function ajustarEscala(){
  const W = 384, H = 804;
  const estreito = innerWidth <= 980;
  // abaixo do celular: botões de simular (~90) e nota (~90), com os espaços
  // acima do celular: abas (~56); abaixo: simular (~90) e nota (~90), com os espaços
  const s = estreito ? Math.min(1, (innerWidth - 32) / W) : Math.min(1, Math.max(.6, (innerHeight - 32 - 284) / H));
  document.documentElement.style.setProperty('--s', s.toFixed(3));
}
addEventListener('resize', ajustarEscala);

renderLista();
ajustarEscala();
abrirFluxo(location.hash.slice(1) || 'v1-card');
</script>
