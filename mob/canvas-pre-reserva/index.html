ck; font-size: 13px; line-height: 17px; font-weight: 800; color: #111513\">Livre para todos<\/span><span style=\"display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: #111513; opacity: 0.82\">Cancelar custa os 30 min<\/span><\/div>\n<div style=\"position: absolute; left: 380px; width: 180px; top: 0; height: 88px; box-sizing: border-box; padding: 10px 10px 0 12px; background: #CFE6D6; border-right: 2px solid #FFFFFF; overflow: hidden\"><span style=\"display: block; font-size: 13px; line-height: 17px; font-weight: 800; color: #111513\">Só de quem reservou<\/span><span style=\"display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: #111513; opacity: 0.82\">Ninguém mais inicia<\/span><\/div>\n<div style=\"position: absolute; left: 560px; width: 180px; top: 0; height: 88px; box-sizing: border-box; padding: 10px 10px 0 12px; background: #F5DDBB; border-right: 2px solid #FFFFFF; overflow: hidden\"><span style=\"display: block; font-size: 13px; line-height: 17px; font-weight: 800; color: #6E3000\">Tolerância<\/span><span style=\"display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: #6E3000; opacity: 0.82\">Até 13:15 para conectar<\/span><\/div>\n<div style=\"position: absolute; left: 740px; width: 210px; top: 0; height: 88px; box-sizing: border-box; padding: 10px 10px 0 12px; background: #DCEEE2; border-right: 2px solid #FFFFFF; overflow: hidden\"><span style=\"display: block; font-size: 13px; line-height: 17px; font-weight: 800; color: #111513\">Recarga da reserva<\/span><span style=\"display: block; margin-top: 2px; font-size: 12px; line-height: 16px; color: #111513; opacity: 0.82\">Não conectou? Libera às 13:15<\/span><\/div>\n<div style=\"position: absolute; left: 950px; width: 118px; top: 0; height: 88px; box-sizing: border-box; padding: 10px 10px 0 12px; background: #F2F4F3; border-right: 2px solid #FFFFFF; overflow: hidden\"><span style=\"display: block; font-size: 13px; line-height: 17px; font-weight: 8 font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Chegou e carregou 23,7 kWh<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Voltam R$&nbsp;23,81 para o saldo na hora<\/span><\/span><span style=\"flex-shrink: 0; font-size: 15px; line-height: 22px; font-weight: 800; color: #111513; font-variant-numeric: tabular-nums; white-space: nowrap\">R$&nbsp;89,59<\/span><\/div>\n<div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; align-items: flex-start; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #338449; color: #FFFFFF; border: 1px solid #338449; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Pedido<\/span><\/span><\/span><span style=\"flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Não conectou até 13:15<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">30 min de recarga (15 antes e 15 depois do início). Voltam R$&nbsp;56,70<\/span><\/span><span style=\"flex-shrink: 0; font-size: 15px; line-height: 22px; font-weight: 800; color: #B23B32; font-variant-numeric: tabular-nums; white-space: nowrap\">R$&nbsp;56,70<\/span><\/div>\n<div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; align-items: flex-start; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Cancelou depois das 12:00<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Igual a não vir: a bomba deixou de atender quem chegaria<\/span><\/span><span style=\"flex-shrink: 0; font-size: 15px; line-height: 22px; font-weight: 800; color: #B23B32; font-variant-numeric: tabular-nums; white-space: nowrap\">R$&nbsp;56,70<\/span><\/div>\n<div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; align-items: flex-start; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Falha nossa (bomba fora do ar ou ocupada)<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Troca de bomba no preço normal ou devolve tudo<\/span><\/span><span style=\"flex-shrink: 0; font-size: 15px; line-height: 22px; font-weight: 800; color: #276638; font-variant-numeric: tabular-nums; white-space: nowrap\">R$&nbsp;0,00<\/span><\/div><\/section><section style=\"border-radius: 28px; background: #FFFFFF; border: 1px solid #E1E5E2; padding: 24px 26px 22px\"><h3 style=\"margin: 0 0 14px; font-size: 19px; line-height: 25px; font-weight: 800; letter-spacing: -0.02em\">Para quem reserva<\/h3><ul style=\"margin: 0; padding: 0; list-style: none\"><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #338449; color: #FFFFFF; border: 1px solid #338449; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Pedido<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Reserva para um horário e um tempo<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">No áudio, \"reservar a vaga para determinado horário\", por exemplo 1 h. Aqui: hoje e os 3 dias seguintes, de 30 min a 1 h 30, com a hora de término de cada um<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #338449; color: #FFFFFF; border: 1px solid #338449; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Pedido<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Paga antes, com crédito<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">O valor sai do saldo da carteira; o que faltar entra por Pix antes de confirmar<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #338449; color: #FFFFFF; border: 1px solid #338449; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Pedido<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">15 min antes, a bomba fica só para o login da reserva<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">No posto, só essa conta libera a bomba: pela localização, pelo QR ou no botão<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #338449; color: #FFFFFF; border: 1px solid #338449; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Pedido<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">15 min de tolerância depois do início<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">O áudio fala em 15 a 20 min. A tela usa 15 e mostra a contagem<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #338449; color: #FFFFFF; border: 1px solid #338449; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Pedido<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Não chegou: cobra 30 min de recarga e libera a bomba<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Os 15 min antes e os 15 depois. O resto do crédito volta na hora<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Cancelar grátis até 1 h antes<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Depois disso, custa o mesmo que não vir<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Depois do fim, segue no preço normal<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Se ninguém reservou depois. Se reservou, a recarga para no horário<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Três reservas sem recarga em 30 dias pausam as reservas<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">A pessoa continua recarregando, só não reserva<\/span><\/span><\/li><\/ul><\/section><\/div>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start\"><section style=\"border-radius: 28px; background: #FFFFFF; border: 1px solid #E1E5E2; padding: 24px 26px 22px\"><h3 style=\"margin: 0 0 14px; font-size: 19px; line-height: 25px; font-weight: 800; letter-spacing: -0.02em\">Para quem não reservou<\/h3><ul style=\"margin: 0; padding: 0; list-style: none\"><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">A bomba aparece \"Livre até 12:45\" no posto e no mapa<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Na janela da reserva, \"Reservada\", com o horário em que volta<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Dá para carregar antes da reserva<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">O app mostra quanto tempo cabe, avisa 10 min antes e para sozinho às 12:45<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">QR de uma bomba reservada<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Mostra as bombas livres do posto e oferece avisar se ela liberar às 13:15<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Aviso de vaga<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Quem ligou o aviso recebe às 13:15 se a pessoa da reserva não vier<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Sempre sobra bomba sem reserva<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">No máximo metade das bombas de um posto aceita reserva<\/span><\/span><\/li><\/ul><\/section><section style=\"border-radius: 28px; background: #FFFFFF; border: 1px solid #E1E5E2; padding: 24px 26px 22px\"><h3 style=\"margin: 0 0 14px; font-size: 19px; line-height: 25px; font-weight: 800; letter-spacing: -0.02em\">Para o posto e para a iGreen<\/h3><ul style=\"margin: 0; padding: 0; list-style: none\"><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #338449; color: #FFFFFF; border: 1px solid #338449; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Pedido<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Receita garantida pela bomba parada<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">O dobro e os 30 min de quem não vem pagam os 15 a 30 min em que a bomba espera<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Limites de reserva<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Até metade das bombas de cada posto, para hoje e os 3 dias seguintes, de 30 min a 1 h 30 de duração<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Carro parado na bomba reservada<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">A recarga de quem começou pelo app para às 12:45. Quem começou por cartão ou por outra rede não tem esse limite, e a bomba só fica reservada quando liberar. Um carro estacionado sem carregar pede alguém no posto ou uma regra de ociosidade<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Go Nansen não tem reserva nos manuais<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Caminho 1: pedir o ReserveNow do OCPP e conferir o firmware das bombas. Caminho 2: às 12:45 deixar o conector indisponível e, quando a pessoa chegar, iniciar a recarga para ela; outros apps veem \"indisponível\", e a bomba precisa se soltar sozinha às 13:15 se algo falhar<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Pix não segura valor<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Por isso o crédito na carteira e a devolução imediata. No cartão, pré&#8209;autorização com estorno do que sobrar<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Defesa do consumidor<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">A regra e os valores aparecem antes de pagar, com aceite. A cobrança é proporcional ao tempo parado, e a contestação fica aberta<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px; align-items: flex-start\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"flex-shrink: 0; height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #FFFFFF; color: #3E4541; border: 1px solid #C7CEC9; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Proposta<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Painel do posto<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">As reservas do dia por bomba, para quem cuida do posto saber quem vem e a que horas<\/span><\/span><\/li><\/ul><\/section><\/div>\n<section style=\"border-radius: 28px; background: #FFFFFF; border: 1px solid #E1E5E2; padding: 24px 26px 22px\"><h3 style=\"margin: 0 0 14px; font-size: 19px; line-height: 25px; font-weight: 800; letter-spacing: -0.02em\">O que o mercado faz<\/h3><p style=\"margin: -4px 0 12px; font-size: 13.5px; line-height: 20px; color: #545C57; max-width: 880px; text-wrap: pretty\">Como outras redes fazem, com fontes em Nova pasta/benchmark-reserva-carregador.md. Ponto de atenção: o dobro e os 30 min de quem não vem são incomuns. Uma taxa fixa de reserva, mostrada antes, seria mais fácil de defender.<\/p>\n<div style=\"display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px\"><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Quem deixa reservar<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Pouca gente, e cada vez menos na carga rápida. A Electra tirou a reserva em fev/2026; a Tesla não reserva e testa fila virtual. O comum é segurar agora, a caminho: WEG 10 min, BYD 15, Volvo Brasil 20. Horário futuro, só a EVgo (até 2 semanas) e o MyChevrolet na rede EZVolt (até 24 h).<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Tolerância<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">15 a 20 min é o padrão. Bate com o pedido.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Bloqueio antes do horário<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Nenhuma rede publica essa regra. No OCPP, a reserva começa quando o sistema manda o comando, então mandar às 12:45 e expirar às 13:15 resolve o pedido.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Preço<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Grátis, taxa fixa (EVgo, US$&nbsp;3) ou por minuto reservado (Monta). Ninguém cobra o kWh em dobro.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Quem não vem<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Em geral a reserva expira e a bomba libera; às vezes há uma multa fixa pequena (EVgo, US$&nbsp;2). Cobrar como 30 min de recarga não apareceu em nenhuma rede.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Cancelar<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">EVgo: grátis até 24 h antes. Zul+ (estacionamento): 3 h de antecedência, sem devolução para quem não vem.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Limites contra abuso<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">char.gy: 1 reserva ativa e 4 por dia. Enel X: 3 seguidas no mesmo conector, depois 20 min de bloqueio.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">O que os outros veem<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">\"Reservado\" ou ocupado, e a bomba recusa quem não reservou. Nenhum app mostra \"livre até 12:45\": aqui seria novidade.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Avisos<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">Contagem regressiva (BYD, WEG) e fila em Live Activity (Tesla). Agenda e \"hora de sair\" pelo trânsito não apareceram.<\/span><\/span><\/div><div style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 74px; flex-shrink: 0; padding-top: 1px\"><span style=\"height: 22px; padding: 0 8px; box-sizing: border-box; border-radius: 11px; background: #E8ECEA; color: #3E4541; border: 1px solid #E1E5E2; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; white-space: nowrap\"><span style=\"margin-top: -1px\">Mercado<\/span><\/span><\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Lei no Brasil<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57; text-wrap: pretty\">O preço é livre (ANEEL, REN 1.000). A regra precisa estar clara e em destaque antes de pagar (CDC 6º, 46 e 54; Decreto 7.962). Multa desproporcional é abusiva (CDC 39 e 51; Código Civil 413), e os Procons já disseram isso de reserva de mesa e de quarto. O crédito não usado volta, e falha da bomba devolve tudo na hora (CDC 51 e 20).<\/span><\/span><\/div><\/div><\/section>\n<section style=\"border-radius: 28px; background: #FFFFFF; border: 1px solid #E1E5E2; padding: 24px 26px 22px\"><h3 style=\"margin: 0 0 14px; font-size: 19px; line-height: 25px; font-weight: 800; letter-spacing: -0.02em\">O que falta decidir<\/h3><ol style=\"margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: 1fr 1fr; column-gap: 32px\"><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">1<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">O dobro vale para a recarga toda?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">Ou só para o kWh carregado dentro do horário reservado<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">2<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Os 30 min de quem não vem usam qual preço?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">No da reserva são R$&nbsp;56,70; no normal, R$&nbsp;28,35<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">3<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">O valor reservado se calcula pelo carro ou pela bomba?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">Pelo carro: o que ele carrega no tempo. Pela bomba: a potência dela no tempo<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">4<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Tolerância de 15 ou de 20 min?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">O áudio fala nos dois<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">5<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Até quando cancelar é grátis?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">A proposta é 1 h antes<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">6<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Quantas bombas por posto aceitam reserva?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">E com quanto tempo de antecedência<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">7<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Quem resolve um carro parado na bomba reservada?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">Atendente, multa de ociosidade ou só a troca de bomba<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">8<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">A Go Nansen aceita reserva pelo OCPP?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">Ou seguramos a bomba pela disponibilidade do conector<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">9<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">O licenciado ganha sobre essa recarga?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">E sobre a cobrança de quem não veio<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">10<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Existe recarga mínima?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">Reservou 1 h e carregou 2 kWh: paga só os 2 kWh?<\/span><\/span><\/li><li style=\"padding: 11px 0; border-top: 1px solid #EEF0EF; display: flex; gap: 12px\"><span style=\"width: 26px; height: 26px; flex-shrink: 0; border-radius: 13px; background: #111513; color: #FFFFFF; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; justify-content: center\">11<\/span><span style=\"min-width: 0; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14.5px; line-height: 20px; font-weight: 700\">Taxa fixa em vez dos 30 min?<\/span><span style=\"font-size: 13px; line-height: 18px; color: #545C57\">O mercado usa taxa fixa p   atual = (i + quadros.length) % quadros.length;
  const q = quadros[atual];
  enquadrar({ x0: q.offsetLeft, y0: q.offsetTop - 40, x1: q.offsetLeft + q.offsetWidth, y1: q.offsetTop + Math.min(q.offsetHeight, 1000) }, 24);
  if (!semHash) history.replaceState(null, '', '#' + q.dataset.id);
}
const focarId = id => { const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i); };

// pan, pinch, no text selection
let ponteiros = new Map(), moveu = 0, d0 = 0, z0 = 1;
vista.addEventListener('selectstart', e => e.preventDefault());
vista.addEventListener('dragstart', e => e.preventDefault());
vista.addEventListener('pointerdown', e => { if (e.button === 0) e.preventDefault(); ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY }); moveu = 0; vista.classList.add('arrastando');
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = z; } });
vista.addEventListener('pointermove', e => {
  const p = ponteiros.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomEm((a.x + b.x) / 2, (a.y + b.y) / 2, (z0 * d / d0) / z); moveu += 10; return; }
  moveu += Math.abs(dx) + Math.abs(dy); px += dx; py += dy; aplicar();
  if (moveu > 4 && !vista.hasPointerCapture(e.pointerId)) vista.setPointerCapture(e.pointerId);
});
const solta = e => { ponteiros.delete(e.pointerId); if (!ponteiros.size) vista.classList.remove('arrastando'); };
vista.addEventListener('pointerup', solta); vista.addEventListener('pointercancel', solta);
vista.addEventListener('click', e => {
  if (moveu > 5) return;
  const alvo = e.composedPath().find(n => n.dataset && n.dataset.alvo);
  if (!alvo) return;
  e.preventDefault();
  const q = quadros[atual];
  if (alvo.dataset.alvo === 'voltar') { if (volta) focarId(volta); return; }
  if (q && !q.dataset.id.startsWith('Folha')) volta = q.dataset.id;
  focarId(alvo.dataset.alvo);
});
vista.addEventListener('dblclick', e => { const q = e.target.closest('.quadro'); if (q) focar(+q.dataset.i); });
vista.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomEm(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022)); else { px -= e.deltaX; py -= e.deltaY; aplicar(); } }, { passive: false });
const centro = () => [vista.clientWidth / 2, vista.clientHeight / 2];
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomEm(...centro(), 1.25); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); zoomEm(...centro(), 0.8); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); verTudo(); }
  else if (e.key === 'ArrowRight') focar(atual + 1);
  else if (e.key === 'ArrowLeft') focar(atual < 0 ? quadros.length - 1 : atual - 1);
  else if (e.key === 'Escape') verTudo();
});
document.getElementById('mais').onclick = () => zoomEm(...centro(), 1.25);
document.getElementById('menos').onclick = () => zoomEm(...centro(), 0.8);
document.getElementById('ajustar').onclick = verTudo;
document.getElementById('proxima').onclick = () => focar(atual + 1);
document.getElementById('anterior').onclick = () => focar(atual < 0 ? quadros.length - 1 : atual - 1);
// a row title is one line, as in the canvas: a longer text shrinks to fit its width
function ajustarTitulos() { for (const h of mundo.querySelectorAll('.titulo-linha')) { h.style.fontSize = '72px'; h.style.lineHeight = '84px'; const w = parseFloat(h.style.width); if (h.scrollWidth > w) { const f = Math.max(20, 72 * w / h.scrollWidth); h.style.fontSize = f + 'px'; h.style.lineHeight = Math.round(f * 1.17) + 'px'; } } }
function abrir() { const id = decodeURIComponent(location.hash.slice(1)); const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i, true); else inicio(); }
window.addEventListener('resize', () => atual < 0 ? inicio() : focar(atual, true));
window.addEventListener('hashchange', abrir);
ajustarTitulos();
abrir();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ajustarTitulos(); if (atual < 0) inicio(); });
</script>
</body>
