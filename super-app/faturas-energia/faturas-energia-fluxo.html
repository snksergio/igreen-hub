//   uc: 'casa' | 'sitio'; pg: the payment in course { conta, usarCb, metodo }
const M = require('./mundo.js');
const K = M.kit;
const { R, F, AJ, U, P, brl, svg, r2, cap, dinheiro, troca, trocas, tela, pronta, folha, elementoCom, board, rolavel, soFolha } = K;

// ---------- the world: September issued on 11/09 at R$ 212,94 (15% off), paid late it loses 5 points of discount and takes
// 2% fine and 25 days of interest; October as in the prototype (R$ 212,30, 15% off, 16% back on time)
const DEF = {
  set: { produto: 'energia', mes: 'setembro', valor: 231.86, pct: 10, desc: 25.05, atraso: true, conta: 250.52, emDia: 212.94, descEmDia: 37.58, multa: 4.51, juros: 1.88, kwh: 222 },
  out: { ...R.CONTAS_DEF.casa, conta: 249.76, kwh: 216 },
};
const PAG = { set: { ...R.PAG.loja, sub2: 'Energia · Casa · UC 3014229088', sub: 'Venceu em 11/09' }, out: R.PAG.casa };
const TXT = {
  set: { rot: 'Fatura de energia de setembro', venc: 'Venceu em 11/09/2026', recebedor: 'iGreen Energia', quita: 'A conta de luz está paga', pagueAte: '09/10/2026', pausa: '09/10', segunda: true, subBoleto: 'Energia · setembro · boleto atualizado' },
  out: { rot: 'Fatura de energia de outubro', venc: 'Vence em 11/10/2026', recebedor: 'iGreen Energia', quita: 'A conta de luz está paga', pagueAte: '11/10/2026', pausa: '11/10', segunda: false, subBoleto: 'Energia · fatura de outubro' },
};
const IDS = ['set', 'out'];
// the cashback from May to August still to use, and the iGreen balance
const BASE_CB = 101.88, CARTEIRA = 300, ECO_ANTES = 132.88, KWH_ANTES = 858;
const FORMA_TXT = { pix: 'Pix', saldo: 'Saldo iGreen', boleto: 'Boleto' };
const diaDe = c => (c.forma === 'boleto' ? '08/10' : '06/10');
const contasDe = est => Object.fromEntries(IDS.map(id => [id, { fase: 'antes', cb: 0, ...(est.contas && est.contas[id]) }]));
const ganhoDe = (id, cb = 0) => Math.round((DEF[id].valor - cb) * DEF[id].pct) / 100;
function numeros(est) {
  const cs = contasDe(est), por = {};
  let disp = BASE_CB, carteira = CARTEIRA, eco = ECO_ANTES, kwh = KWH_ANTES;
  for (const id of IDS) {
    const x = cs[id], g = ganhoDe(id, x.cb || 0);
    por[id] = { ganho: g, rec: x.fase === 'pago' ? g : 0, cam: x.fase === 'agu' ? g : 0 };
    if (x.fase !== 'antes') { disp -= x.cb || 0; if (x.forma === 'saldo') carteira -= r2(DEF[id].valor - (x.cb || 0)); }
    if (x.fase === 'pago') { disp += g; eco += DEF[id].desc; kwh += DEF[id].kwh; }
  }
  return { disp: r2(disp), carteira: r2(carteira), eco: r2(eco), kwh, por, caminho: r2(por.set.cam + por.out.cam) };
}
const chave = est => JSON.stringify({ c: contasDe(est), e: est.emissao || '', u: est.uc || 'casa' });
// the payment of a bill: from the record once paid (or the boleto paid), from the payment in course before
function ctx(est, id) {
  const d = DEF[id], c = contasDe(est)[id], pg = est.pg || {}, n = numeros(est);
  let cb, forma;
  if (c.fase !== 'antes') { cb = c.cb || 0; forma = c.forma; } else { cb = pg.conta === id && pg.usarCb ? Math.min(n.disp, d.valor) : 0; forma = (pg.conta === id && pg.metodo) || 'pix'; }
  cb = r2(cb);
  const v = r2(d.valor - cb);
  return { id, d, cb, v, g: Math.round(v * d.pct) / 100, forma, cartao: 'visa', parcelas: 1, carteira: r2(n.carteira + (c.fase !== 'antes' && forma === 'saldo' ? v : 0)), ...TXT[id] };
}

// ---------- the bills of the moment: overdue, open (or in emission), compensating; all paid, the "em dia" card
K.UNIDADE.sitio = { nome: 'Sítio', uc: 'UC 3015882041', end: 'Estrada do Lago, km 4 · nova', ic: R.PT.folha };
let CARD_SET;
const cardSet = () => (CARD_SET || (CARD_SET = elementoCom(F.telaLista(false, F.lista2Badge), 'aria-label="Fatura de energia vencida"')))
  .split('216,54').join('231,86').split('21,65').join('23,19').replace('25/09/2026', '11/09/2026').replace('há 11 dias', 'há 25 dias');
function cartoes(est) {
  const cs = contasDe(est), n = numeros(est), l = [];
  if (cs.set.fase === 'antes') l.push(cardSet());
  else if (cs.set.fase === 'agu') l.push(K.cardCompensando({ mes: 'Setembro', vence: '11/09/2026', valor: ctx(est, 'set').v, cb: n.por.set.cam }));
  if (cs.out.fase === 'antes') l.push(est.emissao ? K.cardEmissao() : F.aberta(F.OUT, F.PILHA_VOLTA));
  else if (cs.out.fase === 'agu') l.push(K.cardCompensando({ mes: 'Outubro', vence: '11/10/2026', valor: ctx(est, 'out').v, cb: n.por.out.cam }));
  if (!l.length) l.push(K.cardEmDia('Contas em dia', 'A fatura de novembro chega até 25/10', 'Cashback das faturas', r2(n.por.set.rec + n.por.out.rec), diaDe(cs.out)));
  return l;
}
const pilhaCartoes = est => `<div style="display: flex; flex-direction: column; gap: 12px">${cartoes(est).join('\n')}</div>`;
// the paid ones: this cycle's on top of May to August
function pagas(est) {
  const cs = contasDe(est), n = numeros(est), l = [];
  for (const id of ['out', 'set']) { const x = cs[id]; if (x.fase === 'pago') l.push({ mes: cap(DEF[id].mes), valor: DEF[id].valor, pagaEm: `${diaDe(x)}/2026`, metodo: x.forma + (x.cb ? '-cb' : ''), cb: n.por[id].rec }); }
  return [...l, ...F.PAGAS_MISTAS];
}

// ---------- the energy page: the chart with September overdue, the saving so far, the two bills
const MESES = [...K.MESES_CASA.slice(0, 4), ['Set', 'setembro', 222, 225.47, 10, 231.86, 'vencida'], ['Out', 'outubro', 216, 212.30, 15]];
function energia(est) {
  const cs = contasDe(est), n = numeros(est);
  const meses = MESES.map(m => (m[1] !== 'setembro' || cs.set.fase === 'antes' ? m : [...m.slice(0, 6), cs.set.fase === 'agu' ? 'em compensação' : 'paga']));
  const situ = cs.out.fase === 'antes' ? (est.emissao ? 'em emissão' : 'em aberto') : cs.out.fase === 'agu' ? 'em compensação' : 'paga';
  return K.energia({}, 'casa', { meses, situ, eco: n.eco, kwh: `${n.kwh.toLocaleString('pt-BR')} kWh`, card: pilhaCartoes(est) });
}
// the invoices of the unit (the Sítio has none yet)
const DETALHE_TXT = s => s.replace('Toque numa fatura paga para ver o comprovante.', 'Toque numa fatura paga para ver o detalhe e o comprovante.');
function faturas(est) {
  if ((est.uc || 'casa') === 'sitio') return vazia();
  const l = pagas(est);
  return DETALHE_TXT(tela(K.comUnidade(`${F.cabecalho('Faturas', F.INSTALACAO)}
<div style="margin: 14px 16px 0">${pilhaCartoes(est)}</div>
${F.cabecalhoPagas(l)}
${F.lista2Badge(l)}
${F.rodapeLista}`, 'casa')));
}
function vazia() {
  const card = `<div style="margin: 14px 16px 0">${AJ.cartao(`<div style="padding: 26px 20px 20px; display: flex; flex-direction: column; align-items: center; text-align: center">${U.circulo(svg(R.P.recibo, 24, 1.9), { bg: '#F0F2F1', cor: '#3E4541', s: 56 })}<span style="margin-top: 14px; font-size: 17px; line-height: 22px; font-weight: 800; letter-spacing: -0.01em; text-wrap: balance">Ainda não há faturas por aqui</span><span style="margin-top: 6px; max-width: 280px; font-size: 13.5px; line-height: 19px; color: #545C57; text-wrap: balance">O Sítio entrou agora. A primeira fatura aparece aqui quando fechar.</span><div style="margin-top: 18px; width: 100%">${AJ.btnPrimario('Consultar novamente')}</div></div>`)}</div>`;
  return tela(K.comUnidade(`${F.cabecalho('Faturas', 'Energia')}
${card}
${K.listaDS([{ ic: R.P.casa, titulo: 'Outra unidade?', sub: 'Confira a unidade no topo', attrs: ' data-trocar-uc' }], 14)}
<div style="display: flex; justify-content: center; margin-top: 6px"><button style="height: 44px; padding: 0; border: 0; background: transparent; color: ${K.VERDE_TXT}; font-size: 13.5px; font-weight: 700; text-decoration: underline; text-underline-offset: 3px">Ajuda com a primeira fatura</button></div>
<div style="height: 30px"></div>`, 'sitio'));
}
function carregando(uc) {
  return tela(`${K.ESQ}${K.comUnidade(F.cabecalho('Faturas', 'Energia'), uc)}
<span style="display: block; margin: 18px 20px 8px; font-size: 13px; line-height: 18px; font-weight: 700; color: #545C57">Buscando as faturas desta unidade…</span>
<div aria-busy="true" style="margin: 0 16px; display: flex; flex-direction: column; gap: 12px">${K.blocoEsq()}${K.blocoEsq(false)}${K.blocoEsq(false)}</div>
${K.linhaHora('Consultando com segurança')}
<div style="height: 30px"></div>`);
}

// ---------- the details
// September: the updated boleto (what was issued, what the delay added), what to do with it, the options
function detalheSet(est, pago) {
  const d = DEF.set, x = ctx(est, 'set'), c = contasDe(est).set, g = pago ? x.g : ganhoDe('set');
  const ok = { bg: '#E5F1E8', cor: K.VERDE_TXT, borda: '#CFE6D6', ic: P.check };
  const selo = pago ? AJ.seloTopo(`Paga em ${diaDe(c)}`, ok) : AJ.seloTopo('Vencida há 25 dias', { bg: '#FDEBDD', cor: '#F46600', borda: '#F6CDAE', ic: P.relogio });
  const topo = `<div style="padding: 18px 18px ${pago ? 16 : 6}px"><div style="display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px"><span style="font-size: 13px; color: #545C57">${pago ? 'Valor da fatura' : 'Valor do boleto atualizado'}</span>${selo}</div><div style="margin-top: 4px">${AJ.grande(d.valor, { t: 40 })}</div>${pago ? `<span style="display: block; margin-top: 4px; font-size: 13px; line-height: 18px; color: #545C57">Paga com ${FORMA_TXT[x.forma]}${x.cb ? ' e cashback' : ''}</span>` : `<div style="margin-top: 10px">${AJ.kv('Vencimento original', '11/09/2026', { primeiro: true })}${AJ.kv('Novo vencimento', '09/10/2026', { forte: true })}</div>`}</div>`;
  const linhas = AJ.kv('Conta sem a iGreen', brl(d.conta), { primeiro: true }) + AJ.kv('Energia verde compensada', `${d.kwh} kWh`) + AJ.kv('Desconto em dia (15%)', '− ' + brl(d.descEmDia), { cor: K.VERDE_TXT })
    + AJ.kv('Fatura original (11/09)', brl(d.emDia)) + AJ.kv('Desconto perdido', '+ ' + brl(r2(d.descEmDia - d.desc)), { cor: '#B84D00' }) + AJ.kv('Multa por atraso (2%)', '+ ' + brl(d.multa), { cor: '#B84D00' }) + AJ.kv('Juros (25 dias)', '+ ' + brl(d.juros), { cor: '#B84D00' })
    + (pago && x.cb ? AJ.kv('Cashback usado', '− ' + brl(x.cb), { cor: K.VERDE_TXT }) : '') + AJ.kv(pago ? 'Você pagou' : 'Total atualizado', brl(pago ? x.v : d.valor), { forte: true });
  const cbLinha = pago ? AJ.pilulaCasinha(`<span style="font-weight: 800">+ ${brl(g)}</span> de cashback · 10%`).replace('margin-top: 10px', 'margin-top: 0') : R.faixaPilha(`Pagando hoje, ganhe ${R.valorForte(g)} de cashback`);
  // on time it would have cost the issued bill less its 16% back
  const perdeu = r2((d.valor - g) - (d.emDia - Math.round(d.emDia * 16) / 100));
  const entenda = pago ? '' : `${AJ.T.rotulo('Entenda a atualização')}
${K.Tb.cascaAviso({ tom: 'atencao', conteudo: `<p style="margin: 0; font-size: 13.5px; line-height: 20px; color: #3E4541; text-wrap: pretty">O boleto de 11/09 venceu. Este é o <span style="font-weight: 800; color: #111513">boleto novo</span>, atualizado hoje com multa e juros; com o atraso, o desconto ficou em 10%. Use só este para pagar.</p>`, icone: P.relogio, texto: `Em dia: ${brl(perdeu)} a menos`, pad: '14px 16px', mt: 0 })}`;
  const c2 = `${AJ.cabecalho('Fatura de setembro', 'Energia · Casa · UC 3014229088')}
<div style="margin: 14px 16px 0">${AJ.cartao(topo)}</div>
${entenda}
${AJ.T.rotulo('O que tem nesta fatura')}
${AJ.bloco(AJ.cartao(`<div style="padding: 2px 16px">${linhas}<div style="padding: 2px 0 14px">${cbLinha}</div></div>`), 0)}
${AJ.T.rotulo('Mais opções')}
${AJ.bloco(AJ.cartao(`<div style="padding: 2px 16px">${AJ.linhaOpcao(P.baixar, pago ? 'Baixar fatura em PDF' : 'Baixar 2ª via atualizada', pago ? 'A conta de luz completa' : 'PDF com o boleto novo', 0)}${AJ.linhaOpcao(AJ.BANDEIRA, 'Contestar um valor', 'Resposta em até 30 dias · o valor fica suspenso', 1)}</div>`), 0)}
${AJ.rodapeFixo(AJ.btnPrimario(pago ? 'Ver comprovante' : `Pagar ${brl(d.valor)}`))}`;
  if (pago) return K.tudoCerto(c2);
  const k = c2.indexOf('Baixar 2ª via atualizada'), b = c2.lastIndexOf('<button', k);
  return c2.slice(0, b) + AJ.linhaOpcao(R.PT.barras, 'Copiar código de barras', 'Do boleto atualizado', 0) + AJ.linhaOpcao(R.PT.recibo, 'Já paguei esta fatura', 'Envie o comprovante', 1)
    + c2.slice(b).replace('border: 0; background: transparent', 'border: 0; border-top: 1px solid #EEF0EF; background: transparent');
}
function detalheOut(est, pago) {
  if (!pago) return K.comOpcoes(K.comEnergia(R.faturaDetalhe({ mes: 'outubro', aberta: true }), 216), [[R.PT.barras, 'Copiar código de barras', 'Pague no app do banco']]);
  const x = ctx(est, 'out');
  return K.tudoCerto(K.comEnergia(R.faturaDetalhe({ mes: 'outubro', aberta: false, pagaEm: diaDe(contasDe(est).out), forma: `${FORMA_TXT[x.forma]}${x.cb ? ' e cashback' : ''}`, cb: x.g, cbUsado: x.cb, regra: '16% · paga em dia' }), 216));
}
// the receipt of a bill of the cycle
function comprovante(est, id) {
  const x = ctx(est, id), [data, hora] = x.forma === 'boleto' ? ['08/10/2026', '09:12'] : ['06/10/2026', '14:32'];
  return R.comprovanteEnergia({ mes: DEF[id].mes, valor: DEF[id].valor, forma: `${FORMA_TXT[x.forma]}${x.cb ? ' e cashback' : ''}`, data, hora, cbUsado: x.cb, ganho: x.g, economia: DEF[id].desc, regra: id === 'set' ? '10%' : '16% · paga em dia', id: `IG2026${data.slice(3, 5)}${data.slice(0, 2)}${hora.replace(':', '')}00${id.toUpperCase()}${x.forma.slice(0, 2).toUpperCase()}` });
}
// the consultation is down: the last confirmed information stays
const NOME_F = { set: 'Luz de setembro', out: 'Luz de outubro' };
function consultaErro(est, id) {
  const x = contasDe(est)[id], d = DEF[id], pago = x.fase === 'pago';
  const situ = pago ? `Paga em ${diaDe(x)}` : x.fase === 'agu' ? 'Em compensação' : id === 'set' ? 'Vencida' : 'Vence em 11/10';
  const linhas = AJ.kv('Fatura', NOME_F[id], { primeiro: true }) + AJ.kv('Situação', situ) + AJ.kv(pago ? 'Valor pago' : 'Valor', brl(r2(d.valor - (x.cb || 0))), { forte: true });
  return K.telaStatus({ tom: 'neutro', cascaTom: pago ? 'ok' : 'neutro', icone: P.wifiOff, titulo: 'Não conseguimos consultar agora', sub: 'O serviço de consulta está fora do ar. Isso não quer dizer que exista conta em aberto.',
    casca: `<span style="display: block; padding-top: 12px; font-size: 12.5px; line-height: 17px; font-weight: 700; color: #545C57">Última informação confirmada</span>${linhas}`, pad: '0 16px 2px',
    nota: pago ? 'Segue paga: não pague de novo' : id === 'set' ? 'O boleto atualizado vale até 09/10' : 'O boleto continua valendo', notaIc: pago ? P.check : P.info, extra: K.linhaHora('Tentativa hoje, 09:41'),
    rodape: AJ.btnPrimario('Tentar novamente') + K.btnTexto('Falar com a ajuda') });
}

// ---------- the sheets
const COM_SALDO = (x, falta, podeCb, disp) => `<div style="margin-top: 12px; border-radius: 20px; background: #F4F6F5; border: 1px solid #E7EBE8; padding: 2px 14px">${AJ.kv('Para pagar', brl(x.v), { primeiro: true })}${AJ.kv('Seu saldo iGreen', brl(x.carteira))}${AJ.kv('Faltam', brl(falta), { forte: true, cor: '#B84D00' })}</div>${podeCb ? `<div style="margin-top: 12px">${R.faixaPilha(`Com o cashback, paga ${R.valorForte(r2(x.d.valor - Math.min(disp, x.d.valor)), '#1F4D2C')}`)}</div>` : ''}`;

function folhaInstalacoes(est) {

  return K.folhaBase('Unidades consumidoras', '2 unidades no seu CPF', `<div role="radiogroup" aria-label="Unidades consumidoras" style="margin-top: 4px; padding: 0 4px">${[
    { ic: R.P.casa, titulo: 'Casa', linhas: ['Rua das Flores, 120 · Centro', 'UC 3014229088 · Residencial'], chip, tom, sel: uc === 'casa', attrs: ' data-uc="casa"' },
    { ic: R.PT.folha, titulo: 'Sítio', linhas: ['Estrada do Lago, km 4', 'UC 3015882041 · Rural'], chip: 'Unidade nova · sem faturas', tom: 'ambar', sel: uc === 'sitio', attrs: ' data-uc="sitio"' },
  ].map(K.contaLinha).join('')}${K.adicionarConta('Adicionar unidade')}</div>`);
}
// the saving month by month: the discount of each paid bill and the green energy it compensated
const RECIBO_ECO = [['Agosto', 219, 37.02], ['Julho', 207, 35.01], ['Junho', 218, 24.57], ['Maio', 214, 36.28]];
function folhaEconomia(est) {
  const cs = contasDe(est), n = numeros(est), meses = [];
  if (cs.out.fase === 'pago') meses.push(['Outubro', DEF.out.kwh, DEF.out.desc]);
  if (cs.set.fase === 'pago') meses.push(['Setembro', DEF.set.kwh, DEF.set.desc]);
  meses.push(...RECIBO_ECO);
  const topo = `<div style="margin-top: 12px; border-radius: 22px; background: #F3F8F5; border: 1px solid #DCEDE2; padding: 14px 16px"><span style="display: block; font-size: 13px; line-height: 18px; font-weight: 600; color: #545C57">Já economizou na Casa</span><div style="margin-top: 2px">${AJ.grandeVerde(n.eco, 34)}</div><span style="display: block; margin-top: 4px; font-size: 12.5px; line-height: 17px; color: #276638; font-weight: 700">${n.kwh.toLocaleString('pt-BR')} kWh de energia verde compensada</span></div>`;
  const linhas = `<div style="margin-top: 12px; border-radius: 20px; border: 1px solid #E1E5E2; padding: 2px 14px">${meses.map(([m, k, v], i) => AJ.kv(`${m} · ${k} kWh`, '− ' + brl(v), { primeiro: !i, cor: K.VERDE_TXT })).join('')}</div>`;
  return K.folhaBase('Sua economia', 'O desconto de cada fatura paga', `${topo}${linhas}<div style="margin-top: 16px">${AJ.btnPrimario('Entendi')}</div>`);
}
function folhaCashback(est) {
  const n = numeros(est), cs = contasDe(est), prox = cs.out.fase === 'antes' ? `Pagando outubro até 11/10, ganhe ${R.valorForte(ganhoDe('out'))}` : cs.set.fase === 'antes' ? `Pagando setembro hoje, ganhe ${R.valorForte(ganhoDe('set'))}` : '';
  return K.folhaBase('Seu cashback', 'Volta a cada fatura paga', `<div style="margin-top: 12px; border-radius: 20px; background: #F4F6F5; border: 1px solid #E7EBE8; padding: 2px 14px">${AJ.kv('Disponível para usar', brl(n.disp), { primeiro: true, forte: true, cor: K.VERDE_TXT })}${n.caminho ? AJ.kv('A receber', brl(n.caminho), { cor: '#9A4A00' }) : ''}${AJ.kv('Use em qualquer fatura', 'ou resgate')}</div>${prox ? `<div style="margin-top: 12px">${R.faixaPilha(prox)}</div>` : ''}<div style="margin-top: 16px">${AJ.btnPrimario('Entendi')}</div>`);
}

// ---------- paying: the app's boards with each bill's values and words
function pagamento(nome, est, id) {

    { id: 'tudo-pago', titulo: 'As duas pagas', base: { contas: { set: { fase: 'pago', forma: 'pix', cb: 0 }, out: { fase: 'pago', forma: 'boleto', cb: 0 } } }, desc: 'Com setembro e outubro pagos, a página de Energia e a lista ficam em dia, a economia cresce e cada detalhe diz que está tudo certo.', passos: [['Energia em dia', 'Energia'], ['Faturas em dia', 'Faturas:casa'], ['Outubro: tudo certo', 'FaturaPaga:out'], ['Setembro: tudo certo', 'FaturaPaga:set'], ['Sua economia', 'Faturas:casa+F:Economia']] },

    { grupo: 'Pagar', id: 'vencida-pix', titulo: 'Pagar a vencida no Pix', desc: 'O boleto atualizado de setembro, com multa e juros de hoje. O Pix quita na hora e 10% voltam como cashback.', passos: [['Faturas', 'Faturas:casa'], ['Setembro: boleto atualizado', 'FaturaDetalhe:set'], ['Pagar fatura', 'Pagar:set', pg('set', 'pix')], ['Pix: copia e cola e QR', 'Pix:set'], ['Pagamento confirmado + cashback', 'Confirmado:set', pago('set', 'pix')], ['Comprovante', 'Comprovante:set'], ['Faturas: só outubro em aberto', 'Faturas:casa']] },
    { id: 'aberta-boleto', titulo: 'Pagar a aberta no boleto', desc: 'Outubro, ainda no prazo. Use Simular, embaixo do celular, para o banco pagar e o boleto compensar: o cashback aparece a receber e depois cai.', passos: [['Outubro: detalhe', 'FaturaDetalhe:out'], ['Pagar fatura', 'Pagar:out', pg('out', 'boleto')], ['Boleto da fatura', 'Boleto:out'], ['Pagar no app do banco', 'Boleto:out+F:BoletoPagar:out'], ['Boleto em compensação', 'Aguardando:out', pago('out', 'boleto', { fase: 'agu' })], ['Faturas: em compensação', 'Faturas:casa'], ['Pagamento confirmado + cashback', 'Confirmado:out', pago('out', 'boleto')], ['Comprovante', 'Comprovante:out']] },
    { id: 'cashback-saldo', titulo: 'Cashback e saldo iGreen', desc: 'O cashback abate a vencida e o resto sai do saldo iGreen (senha de 4 números: digite quaisquer). O que voltar fica para a próxima.', passos: [['Pagar setembro com o cashback', 'Pagar:set', pg('set', 'saldo', { usarCb: true })], ['Senha do saldo', 'Pagar:set+F:Senha:set'], ['Pagamento confirmado', 'Confirmado:set', pago('set', 'saldo', { cb: true })], ['Comprovante', 'Comprovante:set'], ['Seu cashback', 'Faturas:casa+F:Cashback']] },

    { grupo: 'Estados da fatura', id: 'emissao', titulo: 'Boleto em emissão', desc: 'Outubro já fechou mas o boleto ainda está saindo: o valor aparece como previsto e não há o que pagar. Consultar de novo traz o boleto.', passos: [['Energia', 'Energia', { emissao: 'emissao' }], ['Faturas: em emissão', 'Faturas:casa'], ['Acompanhar a emissão', 'Emissao'], ['Boleto emitido', 'FaturaDetalhe:out', { emissao: '' }], ['Pagar fatura', 'Pagar:out', pg('out', 'pix')]] },
    { id: 'ja-paguei', titulo: 'Vencida: já paguei', desc: 'Quem pagou o boleto antigo e ainda vê a vencida pode avisar: a compensação leva até 2 dias úteis e o comprovante resolve.', passos: [['Setembro: boleto atualizado', 'FaturaDetalhe:set'], ['Já pagou esta fatura?', 'FaturaDetalhe:set+F:JaPaguei:set'], ['Boleto novo', 'Boleto:set', pg('set', 'boleto')]] },
    { id: 'consulta', titulo: 'Consulta fora do ar', base: { contas: { set: { fase: 'pago', forma: 'pix', cb: 0 } } }, desc: 'Se a consulta falhar, fica a última informação confirmada. Uma fatura paga continua paga: não precisa pagar de novo.', passos: [['Setembro paga', 'FaturaPaga:set'], ['Consulta fora do ar', 'ConsultaErro:set'], ['Outubro em aberto', 'FaturaDetalhe:out'], ['Consulta fora do ar', 'ConsultaErro:out']] },
    { id: 'erros', titulo: 'Pix expirado e saldo insuficiente', desc: 'O código Pix vale até a meia-noite: expirado, gere outro. Pago setembro com o saldo iGreen, o que sobra não cobre outubro.', passos: [['Pix de outubro', 'Pix:out', pg('out', 'pix')], ['Pix expirado', 'PixExpirado:out'], ['Setembro com o saldo', 'Pagar:set', pg('set', 'saldo')], ['Senha do saldo', 'Pagar:set+F:Senha:set'], ['Pagamento confirmado', 'Confirmado:set', pago('set', 'saldo')], ['Outubro com o saldo', 'Pagar:out', pg('out', 'saldo')], ['Saldo insuficiente', 'Pagar:out+F:SaldoInsuficiente:out']] },
    { id: 'unidades', titulo: 'Outra unidade e lista carregando', desc: 'A unidade fica no topo das faturas. Trocar carrega a lista por um instante; o Sítio, que acabou de entrar, ainda não tem fatura.', passos: [['Faturas da Casa', 'Faturas:casa'], ['Unidades consumidoras', 'Faturas:casa+F:Instalacoes'], ['Carregando o Sítio', 'Carregando:sitio', { uc: 'sitio' }], ['Sítio: sem faturas ainda', 'Faturas:sitio']] },
  ];

  let fluxo = null;
  const fluxosEl = $('#fluxos'), passosEl = $('#telas-fluxo');
  function desenharFluxos() {
    let h = '', aberto = false;
    FLUXOS.forEach((f, i) => {
      if (f.grupo) { if (aberto) h += '</div>'; h += `<div class="grupo">${f.grupo}</div><div class="lista-fluxos">`; aberto = true; }
      h += `<button class="fluxo" data-id="${f.id}" aria-current="${f === fluxo}"><span class="num">${i + 1}</span><span>${f.titulo}</span></button>`;
    });
    fluxosEl.innerHTML = h + '</div>';
    fluxosEl.querySelectorAll('.fluxo').forEach(b => b.addEventListener('click', () => { irPara(FLUXOS.find(f => f.id === b.dataset.id)); paraOCelular(); }));
  }
  const SITUACAO = () => {
    const n = N(), cs = M.contasDe(estado), L = [];
    const linha = (id, rot) => {
      const x = cs[id], p = n.por[id];
      if (x.fase === 'antes') L.push([id === 'set' ? 'atraso' : '', `${rot}: <b>${id === 'set' ? 'vencida' : estado.emissao ? 'em emissão' : 'em aberto'}</b> · ${brl(DEF[id].valor)}`]);
      else if (x.fase === 'agu') L.push(['espera', `${rot}: <b>boleto em compensação</b> · ${brl(p.cam)} a receber`]);
      else L.push(['', `${rot} <b>paga</b> · + ${brl(p.rec)} de cashback`]);
    };
    linha('set', 'Setembro'); linha('out', 'Outubro');
    L.push(['', `Cashback em conta: <b>${brl(n.disp)}</b> · saldo iGreen: <b>${brl(n.carteira)}</b>`]);
    return L;
  };
  function desenharPassos(k) {
    passosEl.innerHTML = `<h2>${fluxo.titulo}</h2><p class="desc">${fluxo.desc}</p><ol class="passos" aria-label="Telas do fluxo">${fluxo.passos.map(([t], i) => `<li><button class="passo" data-k="${i}" aria-current="${i === k ? 'step' : 'false'}"><span class="n">${i + 1}</span><span>${t}</span></button></li>`).join('')}</ol>${SITUACAO().map(([cls, txt]) => `<div class="situacao ${cls}"><span class="pt"></span><span>${txt}</span></div>`).join('')}`;
    passosEl.querySelectorAll('.passo').forEach(b => b.addEventListener('click', () => { irPasso(Number(b.dataset.k)); paraOCelular(); }));
  }
  const paraOCelular = () => { if (innerWidth <= 980) $('#moldura').scrollIntoView({ behavior: 'smooth', block: 'start' }); };
  const chaveDe = (f, i) => { const p = f.passos[i]; if (!p.chave) p.chave = M.chave(estadoAte(f, i)); return p.chave; };
  function passoDoCelular(f) {
    const ks = f.passos.map(([, id], i) => (id === atual.id ? i : -1)).filter(i => i >= 0);
    if (!ks.length) return -1;
    const agora = M.chave(estado);
    return ks.find(i => chaveDe(f, i) === agora) ?? ks[0];
  }
  function atualizarPassos() {
    if (!fluxo || !atual) return;
    let k = passoDoCelular(fluxo);
    if (k < 0) {
      const outro = FLUXOS.find(f => f.passos.some(([, id]) => id === atual.id));
      if (outro) { fluxo = outro; marcar(); desenharFluxos(); k = passoDoCelular(fluxo); }
    }
    desenharPassos(k);
  }
  const marcar = () => { try { history.replaceState(null, '', '#' + fluxo.id); } catch (e) {} };
  function aplicar(e, x) {
    for (const [k, v] of Object.entries(x)) {
      if (k === 'contas') for (const [c, o] of Object.entries(v)) e.contas[c] = { ...(e.contas[c] || {}), ...o };
      else if (k === 'pg') e.pg = { ...e.pg, ...v };
      else e[k] = v;
    }
  }
  function estadoAte(f, k) {
    const e = inicial();
    aplicar(e, JSON.parse(JSON.stringify(f.base || {})));
    f.passos.slice(0, k + 1).forEach(([, , extra]) => { if (extra) aplicar(e, typeof extra === 'function' ? extra(e) : extra); });
    return e;
  }
  function irPara(f) { fluxo = f; marcar(); desenharFluxos(); irPasso(0); }
  const vivo = id => { const [n, a] = partes(id.split('+')[0]); return !(/^(Pagar|Pix|PixExpirado|Boleto|FaturaDetalhe)$/.test(n) && a && faseDe(a) !== 'antes'); };
  function irPasso(k) {
    const p = fluxo.passos;
    estado = estadoAte(fluxo, k);
    pilha = p.slice(0, k).map(([, x]) => ({ id: x.split('+')[0], rolagem: 0 })).filter(x => vivo(x.id) && x.id !== p[k][1].split('+')[0]);
    pilha = pilha.filter((x, i) => !pilha.slice(i + 1).some(y => y.id === x.id));
    if (p[0][1] !== HOME) pilha.unshift({ id: HOME, rolagem: 0 });
    retorno = pilha.filter(x => !ehPagamento(x.id));
    render(p[k][1], atual ? 'fade' : 'none');
  }

  // ---------- simulate buttons under the phone
  const simularEl = $('#simular');
  const ICONE_RECOMECAR = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path></svg>';
  const ICONE_TOQUE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"></path></svg>';
  function trocarEmissao(v) {
    estado.emissao = v;
    const b = base(), pagando = /^(Pagar|Pix|PixExpirado|Boleto|FaturaDetalhe):out$/.test(b);
    pilha = pilha.filter(x => !/^(Pagar|Pix|PixExpirado|Boleto):out|^Emissao/.test(x.id));
    render(v && pagando ? 'Emissao' : !v && b === 'Emissao' ? 'FaturaDetalhe:out' : b, 'fade', atual.rol.scrollTop);
    toast(v ? 'Outubro com o boleto em emissão' : 'Outubro com o boleto emitido');
  }
  function atualizarPainel() {
    const extra = [];
    if (atual && !atual.id.includes('+')) {
      const [n, a] = partes(atual.id);
      if (n === 'Boleto' && faseDe(a) === 'antes') extra.push(['Simular pagamento no banco', () => pagarNoBanco(a)]);
      if (n === 'Aguardando' && faseDe(a) === 'agu') extra.push(['Simular compensação (2 dias depois)', () => compensar(a)]);
      if (n === 'Pix' && faseDe(a) === 'antes') extra.push(['Simular Pix recebido', () => pagou(a, 'pix')], ['Simular Pix expirado', () => expirar(a)]);
      if ((n === 'FaturaPaga' || n === 'FaturaDetalhe') && DEF[a]) extra.push(['Simular falha na consulta', () => { consultaDe = atual.id; render('ConsultaErro:' + a, 'fade'); }]);
      if (n === 'Faturas' && a !== 'sitio') extra.push(['Simular lista carregando', () => carregar('casa')]);
    }
    simularEl.innerHTML = '<span class="rot">Simular</span><div class="linha"></div><div class="linha"></div>';
    const [l1, l2] = simularEl.querySelectorAll('.linha');
    extra.forEach(([t, fn], i) => { const b = document.createElement('button'); b.className = i ? '' : 'destaque'; b.innerHTML = (i ? '' : ICONE_TOQUE) + t; b.onclick = fn; l1.appendChild(b); });
    if (faseDe('out') === 'antes') {
      const e = document.createElement('button'), ligado = !!estado.emissao;
      e.className = 'modelo' + (ligado ? ' ativo' : '');
      e.innerHTML = '<span class="pt"></span>' + (ligado ? 'Outubro: boleto emitido' : 'Outubro: simular boleto em emissão');
      e.onclick = () => trocarEmissao(ligado ? '' : 'emissao');
      l2.appendChild(e);
    }
    const r = document.createElement('button');
    r.innerHTML = ICONE_RECOMECAR + 'Recomeçar o fluxo';
    r.onclick = () => irPara(fluxo);
    l2.appendChild(r);
    const h = document.createElement('button');
    h.innerHTML = 'Voltar para Energia';
    h.onclick = () => { estado = inicial(); retorno = null; inicio(); };
    l2.appendChild(h);
  }

  // ---------- phone chrome
  const relogio = $('#hora');
  const tic = () => { relogio.textContent = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }); };
  tic(); setInterval(tic, 5000);
  let escala = 1;
  const ajustar = () => {
    const largo = innerWidth > 980;
    const pelaLargura = (innerWidth - (largo ? 32 + 600 + 2 * Math.min(64, Math.max(28, innerWidth * 0.04)) : 32)) / 414;
    escala = Math.max(0.45, Math.min(1, pelaLargura, largo ? (innerHeight - 32 - 12 - 150) / 868 : 1));
    document.documentElement.style.setProperty('--s', escala.toFixed(3));
  };
  addEventListener('resize', ajustar); ajustar();
  addEventListener('dragstart', e => e.preventDefault());
  addEventListener('keydown', e => {
    if (e.key === 'h' || e.key === 'H') document.body.classList.toggle('limpo');
    if (e.key === 'ArrowLeft' || e.key === 'Backspace') voltar();
  });
  const faltam = FLUXOS.flatMap(f => f.passos.map(([, id]) => id)).filter(id => !existe(id));
  if (faltam.length) console.warn('ids que não existem:', faltam);

  const doLink = FLUXOS.find(f => f.id === location.hash.slice(1));
  irPara(doLink || FLUXOS[0]);
})();

}).catch(e => {
  console.error(e);
  const t = document.getElementById('toast');
  t.textContent = 'Este navegador não conseguiu abrir o protótipo. Tente no Chrome, Edge ou Safari atualizados.';
  t.classList.add('on');
});
</script>
</body>
</html>
