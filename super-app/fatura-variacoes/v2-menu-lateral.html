<meta charset="utf-8">

<title>Variações da Fatura iGreen</title>

<style>
/* Layout: cabeçalho simples, barra de opções, palco com a tela (Invoice Web no fundo cinza da produção ou folha A4) e, ao lado, as notas da tela. Tema claro único. */
:root{
  color-scheme:light;
  --bg:#F5F6F6;
  --surface:#FFFFFF;
  --ink:#1E2420;
  --muted:#66706A;
  --line:#E3E7E4;
  --line-2:#CFD6D1;
  --track:#ECEFED;
  --hover:#F2F5F3;
  --accent:#009222;
  --accent-ink:#FFFFFF;
  --removed:#C2410C;
  --data:#2A57BF;
  --warn:#8A5800;
  --spot:#E39A00;
  --shadow:rgba(20,32,24,.14);
  --pdf-desk:#E9ECEA;

  --f-ui:"Segoe UI", -apple-system, BlinkMacSystemFont, Roboto, "Helvetica Neue", Arial, sans-serif;
  --f-ig:"Montserrat", "Segoe UI", Arial, sans-serif;
  --f-code:ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;

  /* Produto iGreen, igual à produção */
  --ig-green:#009222;
  --ig-green-2:#00B22A;
  --ig-bg:#F2F5F7;
  --ig-ink:#181D11;
  --ig-black:#000000;
  --ig-muted:#6A7570;
  --ig-divider:#E9ECEE;
  --ig-tear:#D3D8DC;
  --ig-chip:#F1F2F2;
  --ig-white:#FFFFFF;
  --ig-toast:#4FA94D;
  --ig-shadow:rgba(0,66,110,.10);
  --ig-shadow-1:rgba(0,66,110,.06);
  --ig-green-glow:rgba(0,146,34,.40);
  --a-removed:#C2410C;
  --a-removed-wash:rgba(194,65,12,.07);
  --a-data:#2A57BF;
  --a-data-wash:#E7EDFB;
  --a-warn:#8A5800;
  --a-warn-wash:#FDF1D6;

  /* Folha PDF */
  --pdf-paper:#FFFFFF;
  --pdf-ink:#1B2420;
  --pdf-muted:#5E6B63;
  --pdf-line:#D3DAD5;
  --pdf-soft:#EDF7EE;
  --pdf-bar:#CFE9D2;
  --pdf-mark:rgba(27,36,32,.045);
  --pdf-line-2:#C2CCC6;
  --pdf-faint:#F5F7F6;
  --v2-tint:#F1F7F2;
  --v2-glow:rgba(255,255,255,.10);
  --v2-white-line:rgba(255,255,255,.35);
  --fc-ink:#000000;
  /* V3: tons da fatura atual */
  --v3-frame-1:#52B154;
  --v3-frame-2:#1F8538;
  --v3-box:#3E9F45;
  --v3-ink:#2B7A33;
  --v3-tag:#1E6B2C;
  --v3-outline:#A8D2AA;
  --v3-gray:#EEF1EF;
  --v3-glow:rgba(255,255,255,.14);
  --v3-pig-shadow:rgba(0,60,20,.35);
}

*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none !important}
body{background:var(--bg); color:var(--ink); font:14px/1.55 var(--f-ui); -webkit-font-smoothing:antialiased}
button{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

.app{--gut:16px; max-width:1440px; margin-inline:auto; padding-inline:var(--gut); padding-block:0 56px}
@media (min-width:720px){ .app{--gut:28px} }

/* ---------- Invoice Web no fundo cinza da produção ---------- */
.webview{background:var(--ig-bg)}
.vp{position:relative; width:375px; max-width:100%; margin-inline:auto; border-inline:1px dashed var(--line-2)}
.vp-tag{position:absolute; top:10px; left:10px; z-index:2; font:500 11px/1 var(--f-ui); color:var(--ig-muted)}
@media (max-width:520px){ .vp{border-inline:0} .vp-tag{display:none} }

.ig-screen{background:var(--ig-bg); color:var(--ig-ink); font-family:var(--f-ig); display:flex; flex-direction:column; align-items:center; min-height:820px; padding-block:0 56px}
.ig-col{width:min(360px, calc(100% - 32px)); display:flex; flex-direction:column}
.ig-logo{height:112px; display:grid; place-items:center}
.ig-logo img{display:block; width:92px; height:28px}

/* Ticket: fundo e brilho verde originais + recorte lateral na linha antes do total */
.ig-card-wrap{filter:drop-shadow(0 1px 1px var(--ig-shadow-1)) drop-shadow(0 16px 30px var(--ig-shadow))}
.ig-card{
  --ny:calc(100% - 80px);
  position:relative; isolation:isolate; text-align:center;
  -webkit-mask:radial-gradient(circle 11px at 0 var(--ny), transparent 96%, #000 100%), radial-gradient(circle 11px at 100% var(--ny), transparent 96%, #000 100%);
  -webkit-mask-composite:source-in;
  mask:radial-gradient(circle 11px at 0 var(--ny), transparent 96%, #000 100%), radial-gradient(circle 11px at 100% var(--ny), transparent 96%, #000 100%);
  mask-composite:intersect}

.ig-overlay{position:absolute; top:0; left:0; z-index:0; width:100%; height:auto; pointer-events:none}
.ig-card-in{position:relative; z-index:1; padding:32px 24px 24px}
.ig-pig{display:block; width:80px; height:80px; margin:0 auto 18px}
.ig-badge{display:inline-flex; align-items:center; gap:10px; padding:5px 18px 5px 5px; border-radius:999px; background:var(--ig-green); color:var(--ig-white); font:700 13px/1.2 var(--f-ig); box-shadow:0 8px 16px -8px var(--ig-green-glow)}
.ig-badge-ico{display:grid; place-items:center; width:26px; height:26px; border-radius:50%; background:var(--ig-white); flex:none}
.ig-badge-ico img{display:block; width:15px; height:15px}
.ig-title{position:relative; font:700 16px/1.3 var(--f-ig); color:var(--ig-black); margin:18px -10px 0; padding:10px}
.ig-rows{margin-top:20px; text-align:left}
.ig-row{position:relative; display:flex; justify-content:space-between; align-items:center; gap:16px; padding:16px 0; border-bottom:1px solid var(--ig-divider); font-size:13px; line-height:1.35}
.ig-row.nodiv{border-bottom:0}
.ig-l{font-weight:700; color:var(--ig-black); min-width:0}
.ig-v{display:flex; flex-direction:column; align-items:flex-end; text-align:right; color:var(--ig-ink); white-space:nowrap}
.ig-cb{display:inline-flex; align-items:center; gap:6px; color:var(--ig-green); font-weight:600}
.ig-cb img{display:block; width:12px; height:12px}
.ig-tear{height:1px; margin:8px -10px 0; background:repeating-linear-gradient(90deg, var(--ig-tear) 0 6px, transparent 6px 12px)}
.ig-stub{display:flex; justify-content:space-between; align-items:center; gap:16px; padding:22px 0 4px; text-align:left}
.ig-stub .ig-v strong{font:800 20px/1.1 var(--f-ig); color:var(--ig-ink); letter-spacing:-.01em; font-variant-numeric:tabular-nums}

.ig-pay{display:flex; flex-direction:column; gap:12px; margin-top:36px}
.ig-pay h3{margin:0 0 4px; font:800 16px/1.3 var(--f-ig); color:var(--ig-ink)}
.ig-opt{background:var(--ig-white); border-radius:20px; box-shadow:0 1px 2px var(--ig-shadow)}
.ig-btn{display:flex; align-items:center; gap:14px; width:100%; min-height:76px; padding:18px 20px; border:0; background:transparent; border-radius:20px; cursor:pointer; text-align:left; font:700 14px/1.3 var(--f-ig); color:var(--ig-black)}
.ig-btn:hover{background:var(--ig-bg)}
.ig-btn:focus-visible{outline:2px solid var(--ig-green); outline-offset:-2px}
.ig-btn .ico{flex:none; width:40px; height:40px; border-radius:50%; background:var(--ig-chip); display:grid; place-items:center}
.ig-btn .ico img{display:block; width:16px; height:16px}
.ig-btn .t{flex:1; min-width:0}
.ig-btn .chev{flex:none; display:grid; transition:transform .2s}
.ig-btn .chev img{display:block}
.ig-opt.open .chev{transform:rotate(90deg)}
.ig-pixpanel{display:flex; flex-direction:column; align-items:center; gap:14px; padding:0 20px 22px; text-align:center}
.ig-pixpanel .qr{width:136px; height:136px; color:var(--ig-ink)}
.ig-pixpanel p{margin:0; font:500 12px/1.5 var(--f-ig); color:var(--ig-ink)}
.ig-cta{width:100%; border:0; border-radius:999px; background:var(--ig-green); color:var(--ig-white); font:700 14px/1 var(--f-ig); padding:15px 16px; cursor:pointer}
.ig-app{display:flex; flex-direction:column; align-items:center; gap:18px; padding:44px 8px 0; text-align:center}
.ig-app h2{margin:0; max-width:300px; font:800 16px/1.45 var(--f-ig); color:var(--ig-ink)}
.ig-app h2 b{color:var(--ig-green-2)}
.stores{display:flex; flex-direction:column; gap:14px; align-items:center}
.stores img{display:block; width:163px; height:48px}

.ig-toast{position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); z-index:50; display:flex; align-items:center; gap:8px; width:max-content; max-width:calc(100vw - 32px);
  background:var(--ig-toast); color:var(--ig-white); border-radius:8px; padding:8px 16px; font:500 12.5px/1.35 var(--f-ig); box-shadow:0 10px 30px -10px var(--shadow)}
.ig-toast img{display:block; width:24px; height:24px; flex:none}

/* ---------- Anotações sobre a tela ---------- */
.ghost{position:relative; border:1.5px dashed var(--a-removed); border-radius:8px; background:repeating-linear-gradient(-45deg, transparent 0 6px, var(--a-removed-wash) 6px 12px)}
.ig-row.ghost{margin:12px -10px; padding:14px 10px; border:1.5px dashed var(--a-removed)}
.ghost .s{text-decoration:line-through; text-decoration-color:var(--a-removed); text-decoration-thickness:1.5px; opacity:.6}
.ghost-tag{position:absolute; top:-9px; right:10px; background:var(--a-removed); color:var(--ig-white); font:600 10px/1.7 var(--f-ui); padding:0 7px; border-radius:4px; white-space:nowrap}
.dtag{display:inline-block; margin-top:4px; font:500 9.5px/1.6 var(--f-code); color:var(--a-data); background:var(--a-data-wash); padding:0 5px; border-radius:4px; white-space:nowrap}
.dtag.warn{color:var(--a-warn); background:var(--a-warn-wash); font-family:var(--f-ui); font-weight:600}
.spot{outline:2.5px solid var(--spot) !important; outline-offset:5px; border-radius:12px; animation:pulse 1.1s ease-in-out 2}
@keyframes pulse{50%{outline-offset:9px}}

/* ---------- Fatura PDF (folha A4) ---------- */
.pdf-area{background:var(--pdf-desk); padding:28px 20px}
.pdf-wrap{overflow-x:auto; padding-block:2px 8px}
.sheet{position:relative; container-type:inline-size; display:flex; flex-direction:column; width:100%; min-width:600px; max-width:840px; margin-inline:auto; aspect-ratio:210/297;
  background:var(--pdf-paper); color:var(--pdf-ink); overflow:visible; box-shadow:0 1px 2px var(--shadow), 0 22px 44px -22px var(--shadow)}
.p-in{flex:1; display:flex; flex-direction:column; gap:2.3cqi; padding:4.6cqi 5cqi; font:500 1.25cqi/1.4 var(--f-ig)}
.p-mark{position:absolute; inset:0; z-index:2; display:grid; place-items:center; overflow:hidden; pointer-events:none; font:800 6.4cqi/1 var(--f-ig); color:var(--pdf-mark); white-space:nowrap}
.p-mark span{transform:rotate(-30deg)}
.p-head{display:flex; justify-content:space-between; align-items:flex-end; gap:2cqi; padding-bottom:1.8cqi; border-bottom:.35cqi solid var(--ig-green)}
.p-logo{display:block; height:4.6cqi; width:auto}
.p-title{display:flex; flex-direction:column; align-items:flex-end; gap:.4cqi; text-align:right}
.p-title strong{font:800 2.1cqi/1 var(--f-ig); letter-spacing:.05em}
.p-title span{font-size:1.15cqi; color:var(--pdf-muted)}
.p-title b{color:var(--pdf-ink)}
.p-client{display:grid; grid-template-columns:1.5fr 1fr 1fr; gap:1.3cqi 2.4cqi; padding:1.8cqi 2.2cqi; background:var(--pdf-soft); border-radius:1.1cqi}
.kv{min-width:0}
.kv span{display:block; font:700 .92cqi/1.3 var(--f-ig); letter-spacing:.06em; text-transform:uppercase; color:var(--pdf-muted)}
.kv b{font-weight:600; font-size:1.28cqi}
.p-sec-h{margin:0 0 1.1cqi; font:800 1.1cqi/1.2 var(--f-ig); letter-spacing:.08em; text-transform:uppercase; color:var(--pdf-ink)}
.p-sum{display:flex; gap:1.3cqi}
.p-box{position:relative; flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:.6cqi; padding:1.6cqi 1.5cqi; border:.15cqi solid var(--pdf-line); border-radius:1.2cqi}
.p-box.energy{flex-grow:.85}
.p-box.wide{flex-grow:1.9}
.p-lbl{display:flex; align-items:center; gap:.6cqi; font:800 .98cqi/1.25 var(--f-ig); letter-spacing:.06em; text-transform:uppercase; color:var(--pdf-muted)}
.p-lbl img{width:1.5cqi; height:1.5cqi; flex:none}
.p-val{font:800 2.25cqi/1.1 var(--f-ig); color:var(--pdf-ink); white-space:nowrap; font-variant-numeric:tabular-nums}
.p-val small{font-size:1.3cqi; font-weight:700}
.p-box.wide .p-val{font-size:2.9cqi}
.p-sub{font-size:1.02cqi; line-height:1.3; color:var(--pdf-muted)}
.p-box.benefit{background:var(--ig-green); border-color:var(--ig-green)}
.p-box.benefit .p-lbl{font-size:1.12cqi; color:var(--ig-white)}
.p-box.benefit .p-val, .p-box.benefit .p-sub{color:var(--ig-white)}
.p-box.due{border:.3cqi solid var(--ig-green)}
.p-box.due .p-val{color:var(--ig-green)}
.p-box.ghost{border:.2cqi dashed var(--a-removed)}
.sheet .ghost-tag{top:-1cqi; right:1.2cqi; font-size:.92cqi; padding:0 .6cqi; border-radius:.5cqi}
.sheet .dtag{font-size:.88cqi; margin-top:.2cqi; align-self:flex-start; padding:0 .5cqi}
.p-mid{display:grid; grid-template-columns:1.35fr 1fr; gap:2.2cqi}
.p-panel{border:.15cqi solid var(--pdf-line); border-radius:1.2cqi; padding:1.7cqi 1.8cqi; min-width:0}
.chart{display:block; width:100%; height:auto}
.chart .gl{stroke:var(--pdf-line); stroke-width:.5}
.chart .ax{font:600 6.5px var(--f-ig); fill:var(--pdf-muted)}
.chart .ax.b{fill:var(--pdf-ink); font-weight:800}
.chart .bar{fill:var(--pdf-bar)} .chart .bar.now{fill:var(--ig-green)}
.p-dl{display:grid; grid-template-columns:1fr 1fr; gap:.9cqi 1.6cqi; margin:0 0 1.8cqi}
.p-dl dt{font:700 .9cqi/1.3 var(--f-ig); letter-spacing:.05em; text-transform:uppercase; color:var(--pdf-muted)}
.p-dl dd{margin:0; font-weight:600}
.p-msg{margin:0; font-size:1.18cqi; line-height:1.45}
.p-msg b{font-weight:800}
.p-cut{margin-top:auto; display:flex; align-items:center; gap:1.2cqi; font:700 .88cqi/1 var(--f-ig); letter-spacing:.12em; text-transform:uppercase; color:var(--pdf-muted)}
.p-cut::before,.p-cut::after{content:""; flex:1; border-top:.15cqi dashed var(--pdf-muted)}
.p-bol{display:flex; flex-direction:column; gap:1cqi}
.b-top{display:flex; align-items:flex-end; gap:2cqi; padding-bottom:.8cqi; border-bottom:.3cqi solid var(--pdf-ink)}
.b-bank{font:800 2cqi/1 var(--f-ig); white-space:nowrap}
.b-bank i{font-style:normal; color:var(--pdf-line); margin-inline:.6cqi}
.b-line{margin-left:auto; font:600 1.5cqi/1 var(--f-code); letter-spacing:.02em; white-space:nowrap}
.b-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:.12cqi; background:var(--pdf-ink); border:.12cqi solid var(--pdf-ink)}
.b-f{display:flex; flex-direction:column; gap:.25cqi; min-width:0; padding:.75cqi 1cqi; background:var(--pdf-paper)}
.b-f span{font:600 .84cqi/1.2 var(--f-ig); letter-spacing:.04em; text-transform:uppercase; color:var(--pdf-muted)}
.b-f b{font-size:1.2cqi; font-weight:700}
.b-f b.n{font-weight:500; line-height:1.4}
.b-f.span2{grid-column:span 2}
.b-f.hl b{font-size:1.5cqi; font-weight:800}
.b-foot{display:flex; align-items:center; gap:3cqi; margin-top:.6cqi}
.b-bars{flex:1; min-width:0; height:6.4cqi}
.b-bars svg{display:block; width:100%; height:100%; fill:var(--pdf-ink)}
.b-pix{display:flex; align-items:center; gap:1.2cqi; font:800 1.1cqi/1.3 var(--f-ig)}
.b-pix .qr{width:9.5cqi; height:9.5cqi; color:var(--pdf-ink)}
.b-pix small{display:block; font-weight:500; color:var(--pdf-muted); font-size:.95cqi}
.qr .bgq{fill:var(--pdf-paper)}

/* ---------- Fatura PDF V2: topo responde quanto, até quando e quanto você ganhou; ficha de compensação no padrão ---------- */
.v2{flex:1; display:flex; flex-direction:column; gap:1.8cqi; padding:4cqi 5cqi 3cqi; font:500 1.18cqi/1.42 var(--f-ig); color:var(--pdf-ink)}
.v2 p{margin:0}
.v2-head{display:flex; justify-content:space-between; align-items:flex-start; gap:2cqi}
.v2-head .p-logo{height:4.4cqi}
.v2-ref{display:flex; flex-direction:column; align-items:flex-end; gap:.35cqi; text-align:right}
.v2-ref strong{font:800 1.95cqi/1.15 var(--f-ig)}
.v2-ref span{font-size:1.02cqi; color:var(--pdf-muted)}
.v2-issuer{margin-top:-.6cqi; padding-bottom:1.5cqi; border-bottom:.15cqi solid var(--pdf-line); font-size:.9cqi; color:var(--pdf-muted)}
.v2-ghost{display:flex; justify-content:space-between; align-items:center; padding:1cqi 1.6cqi; border-radius:1cqi; font-size:1.1cqi}
.v2-hero{display:grid; grid-template-columns:1.22fr 1fr .98fr; gap:1.3cqi; align-items:stretch}
.v2-pay{position:relative; display:flex; flex-direction:column; gap:.5cqi; padding:2.1cqi 2.2cqi; border-radius:1.6cqi; background:var(--v2-tint)}
.v2-hello{font-size:1.18cqi}
.v2-hello b{font-weight:700}
.v2-lbl{margin-top:1cqi; font:700 1.05cqi/1.3 var(--f-ig); color:var(--pdf-muted)}
.v2-amount{font:800 5.2cqi/1 var(--f-ig); letter-spacing:-.03em; color:var(--pdf-ink); font-variant-numeric:tabular-nums; white-space:nowrap}
.v2-after{display:flex; justify-content:space-between; align-items:baseline; gap:1cqi; margin-top:auto; padding-top:1.1cqi; border-top:.15cqi dashed var(--pdf-line-2); font-size:1.08cqi}
.v2-after b{font-weight:800; font-size:1.5cqi; white-space:nowrap; font-variant-numeric:tabular-nums}
.v2-note{font-size:1.02cqi; color:var(--pdf-muted)}
.v2-note.end{margin-top:auto; padding-top:1.1cqi}
.v2-benefit{position:relative; display:flex; flex-direction:column; gap:.45cqi; padding:2.1cqi 2.2cqi; border-radius:1.6cqi; background:var(--ig-green); color:var(--ig-white); overflow:hidden}
.v2-benefit::after{content:""; position:absolute; right:-6cqi; top:-6cqi; width:16cqi; height:16cqi; border-radius:50%; background:var(--v2-glow)}
.v2-b-top{display:flex; align-items:center; gap:.9cqi}
.v2-chip{display:grid; place-items:center; width:3cqi; height:3cqi; border-radius:50%; background:var(--ig-white); flex:none}
.v2-chip img{width:1.75cqi; height:1.75cqi}
.v2-b-lbl{font:800 1.12cqi/1.2 var(--f-ig); letter-spacing:.07em}
.v2-b-val{margin-top:1cqi; font:800 3.7cqi/1 var(--f-ig); letter-spacing:-.02em; white-space:nowrap; font-variant-numeric:tabular-nums}
.v2-b-sub{font-size:1.05cqi; opacity:.92}
.v2-b-acc{margin-top:auto; padding-top:1.1cqi; border-top:.15cqi solid var(--v2-white-line); display:flex; flex-direction:column; gap:.15cqi}
.v2-b-acc b{font:800 1.6cqi/1.15 var(--f-ig); font-variant-numeric:tabular-nums}
.v2-b-acc span{font-size:.98cqi; opacity:.92}
.v2-benefit .dtag{align-self:flex-start}
.v2-pix{display:flex; flex-direction:column; gap:.9cqi; padding:1.9cqi 2cqi; border:.15cqi solid var(--pdf-line); border-radius:1.6cqi}
.v2-pix-top{display:flex; align-items:center; gap:1.2cqi}
.v2-pix .qr{width:9.6cqi; height:9.6cqi; flex:none; color:var(--pdf-ink)}
.v2-pix strong{display:block; font:800 1.45cqi/1.2 var(--f-ig)}
.v2-pix-top span{display:block; margin-top:.3cqi; font-size:.95cqi; color:var(--pdf-muted); line-height:1.35}
.v2-pix p{font-size:1cqi; line-height:1.4}
.v2-check{display:flex; align-items:flex-start; gap:.6cqi; font-weight:700}
.v2-check img{width:1.5cqi; height:1.5cqi; flex:none}
.v2-two{display:grid; grid-template-columns:1.05fr 1fr 1fr; gap:1.4cqi; align-items:start; padding:1.6cqi 2cqi; border-radius:1.2cqi; background:var(--pdf-faint)}
.v2-two h4{margin:0; font:800 1.25cqi/1.25 var(--f-ig)}
.v2-two p{font-size:1cqi; color:var(--pdf-muted); margin-top:.3cqi}
.v2-bill{display:flex; gap:.9cqi; align-items:flex-start}
.v2-n{display:grid; place-items:center; width:2.2cqi; height:2.2cqi; flex:none; border-radius:50%; background:var(--pdf-ink); color:var(--ig-white); font:800 1cqi/1 var(--f-ig)}
.v2-bill b{display:block; font-weight:800; font-size:1.1cqi}
.v2-bill > div > span{display:block; font-size:1cqi; color:var(--pdf-muted); line-height:1.35}
.v2-mid{display:grid; grid-template-columns:1.5fr 1fr; gap:1.4cqi}
.v2-panel{min-width:0; padding:1.7cqi 1.9cqi; border:.15cqi solid var(--pdf-line); border-radius:1.2cqi}
.v2-panel h4{margin:0 0 .9cqi; font:800 1.2cqi/1.25 var(--f-ig)}
.v2-insight{margin-top:.8cqi !important; font-size:1.02cqi}
.v2-insight b{font-weight:800}
.v2-dl{display:grid; gap:.75cqi; margin:0}
.v2-dl div{display:flex; justify-content:space-between; gap:1.2cqi; padding-bottom:.75cqi; border-bottom:.12cqi solid var(--pdf-line)}
.v2-dl div:last-child{padding-bottom:0; border-bottom:0}
.v2-dl dt{color:var(--pdf-muted); font-size:1cqi}
.v2-dl dd{margin:0; font-weight:700; font-size:1.02cqi; text-align:right}
.v2-cta{display:flex; align-items:center; justify-content:space-between; gap:2cqi; padding:1.4cqi 1.9cqi; border:.15cqi solid var(--pdf-line); border-radius:1.2cqi}
.v2-cta b{display:block; font-weight:800; font-size:1.22cqi}
.v2-cta span{font-size:1cqi; color:var(--pdf-muted)}
.v2-stores{display:flex; gap:1cqi; flex:none}
.v2-stores img{display:block; height:3.4cqi; width:auto}
.v2-cut{margin-top:auto; display:flex; align-items:center; gap:1.2cqi; font:600 .85cqi/1 var(--f-ig); letter-spacing:.06em; color:var(--pdf-muted)}
.v2-cut::before,.v2-cut::after{content:""; flex:1; border-top:.15cqi dashed var(--pdf-line-2)}
/* Ficha de compensação: fundo branco, impressão preta, posições fixas */
.fc{display:flex; flex-direction:column; gap:.6cqi; color:var(--fc-ink); font-family:Arial, "Helvetica Neue", sans-serif}
.fc-top{display:flex; align-items:flex-end; border-bottom:.3cqi solid var(--fc-ink); padding-bottom:.5cqi}
.fc-bank{display:flex; align-items:flex-end; gap:1.2cqi; font:700 1.6cqi/1 Arial, sans-serif; white-space:nowrap}
.fc-bank i{font-style:normal; padding-inline:1.2cqi; border-inline:.25cqi solid var(--fc-ink); font-size:1.9cqi}
.fc-line{margin-left:auto; font:700 1.62cqi/1 var(--f-code); letter-spacing:.01em; white-space:nowrap}
.fc-grid{display:grid; grid-template-columns:repeat(6, minmax(0,1fr)) minmax(0,1.55fr); gap:.12cqi; background:var(--fc-ink); border:.12cqi solid var(--fc-ink)}
.fc-f{display:flex; flex-direction:column; gap:.2cqi; min-width:0; padding:.45cqi .8cqi .55cqi; background:var(--pdf-paper)}
.fc-f span{font-size:.78cqi; line-height:1.2}
.fc-f b{font-size:1.08cqi; font-weight:700; line-height:1.3; overflow-wrap:anywhere}
.fc-f b.n{font-weight:400}
.fc-f.r b{text-align:right}
.s2{grid-column:span 2} .s3{grid-column:span 3} .s6{grid-column:span 6} .s7{grid-column:span 7}
.fc-ins{grid-row:span 4}
.fc-bottom{display:flex; justify-content:space-between; align-items:flex-start; gap:2cqi}
.fc-bars{width:49cqi; height:6.2cqi; margin-left:.4cqi}
.fc-bars svg{display:block; width:100%; height:100%; fill:var(--fc-ink)}
.fc-auth{font-size:.8cqi; text-align:right}

/* ---------- Fatura PDF V3: estrutura e moldura da fatura atual + cards e hierarquia da V2 ---------- */
.v3-frame{flex:1; display:flex; flex-direction:column; padding:2.2cqi 2.2cqi 0; background:linear-gradient(165deg, var(--v3-frame-1), var(--v3-frame-2))}
.v3-page{flex:1; display:flex; flex-direction:column; gap:2.5cqi; padding:3.4cqi 3.6cqi 3cqi; border-radius:2cqi; background:var(--pdf-paper); color:var(--pdf-ink); font:500 1.3cqi/1.42 var(--f-ig)}
.v3-page p{margin:0}
.v3-slogan{padding:1.8cqi 0 1.9cqi; text-align:center; color:var(--ig-white); font:800 1.65cqi/1 var(--f-ig); letter-spacing:.32em}
.v3-head{display:grid; grid-template-columns:1fr 1.25fr; gap:2.6cqi; align-items:start; padding-bottom:1.9cqi; border-bottom:.2cqi solid var(--v3-box)}
.v3-logo{display:block; height:4.8cqi; width:auto}
.v3-issuer{margin-top:1.4cqi; padding:1.1cqi 1.4cqi; border-radius:1cqi; background:var(--v3-gray); font-size:1cqi; line-height:1.5; color:var(--pdf-muted)}
.v3-issuer b{color:var(--pdf-ink); font-weight:700}
.v3-alert, .v3-fraud{position:relative; margin-top:1.2cqi; padding:2.4cqi 2cqi 1.6cqi; border-radius:1.6cqi; background:var(--v3-box); color:var(--ig-white)}
.v3-alert p, .v3-fraud p{font-size:1.14cqi; line-height:1.45}
.v3-alert b, .v3-fraud b{font-weight:800}
.v3-tag{position:absolute; top:-1.2cqi; left:1.6cqi; padding:.65cqi 1.3cqi; border-radius:99cqi; background:var(--v3-tag); color:var(--ig-white); font:800 1cqi/1 var(--f-ig); letter-spacing:.05em}

/* Topo: valor, benefício e Pix no formato de card da V2 */
.v3-hero{display:grid; grid-template-columns:1.1fr 1.12fr .88fr; gap:1.4cqi}
.v3-total{display:flex; flex-direction:column; gap:.45cqi; padding:2.2cqi 2.4cqi; border-radius:1.8cqi; background:var(--v2-tint)}
.v3-lbl{font:800 1cqi/1.25 var(--f-ig); letter-spacing:.05em; color:var(--pdf-muted)}
.v3-amount{margin-top:.4cqi; font:800 5.1cqi/1 var(--f-ig); letter-spacing:-.025em; white-space:nowrap; font-variant-numeric:tabular-nums}
.v3-due{margin-top:.2cqi; font-size:1.35cqi; font-weight:700}
.v3-note{font-size:1.06cqi; line-height:1.4; color:var(--pdf-muted)}
.v3-mini{display:grid; grid-template-columns:1fr 1fr; gap:1.2cqi; margin-top:auto; padding-top:1.3cqi; border-top:.15cqi solid var(--pdf-line-2)}
.v3-mini span{display:block; margin-bottom:.25cqi; font:800 .86cqi/1.25 var(--f-ig); letter-spacing:.04em; color:var(--pdf-muted)}
.v3-mini b{font-size:1.35cqi; font-weight:800; font-variant-numeric:tabular-nums}
.v3-cash{position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:.4cqi; padding:2.2cqi 2.4cqi 2cqi; border-radius:1.8cqi; background:var(--ig-green); color:var(--ig-white); overflow:hidden; isolation:isolate}
.v3-cash::before{content:""; position:absolute; right:-4cqi; bottom:-4cqi; z-index:-1; width:17cqi; height:17cqi; border-radius:50%; background:var(--v3-glow)}
.v3-cash::after{content:""; position:absolute; right:-7cqi; top:-7cqi; z-index:-1; width:15cqi; height:15cqi; border-radius:50%; background:var(--v2-glow)}
.v3-pill{display:inline-flex; align-items:center; gap:.7cqi; padding:.55cqi 1.5cqi .55cqi .55cqi; border-radius:99cqi; background:var(--ig-white); color:var(--ig-green); font:800 1.05cqi/1 var(--f-ig); letter-spacing:.05em}
.v3-pill-ico{display:grid; place-items:center; width:2.4cqi; height:2.4cqi; border-radius:50%; background:var(--v2-tint)}
.v3-pill img{width:1.45cqi; height:1.45cqi}
.v3-cash-val{margin-top:1.1cqi; font:800 4.4cqi/1 var(--f-ig); letter-spacing:-.02em; white-space:nowrap; font-variant-numeric:tabular-nums}
.v3-cash-sub{max-width:62%; font:700 1.15cqi/1.3 var(--f-ig)}
.v3-cash-after{margin-top:.9cqi; padding-top:.9cqi; border-top:.15cqi solid var(--v2-white-line); font-size:1.1cqi; line-height:1.35}
.v3-cash-after b{display:block; font-size:1.5cqi; font-weight:800; font-variant-numeric:tabular-nums}
.v3-cash-foot{margin-top:auto; padding-top:1.1cqi; padding-right:9cqi; font-size:1.05cqi; font-weight:600; line-height:1.35}
.v3-pig{position:absolute; right:1.2cqi; bottom:1.1cqi; width:9.6cqi; height:9.6cqi; filter:drop-shadow(0 .5cqi .8cqi var(--v3-pig-shadow))}
.v3-cash .dtag{margin-top:.3cqi}
.v3-pix{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:.8cqi; padding:1.8cqi 1.7cqi; border:.15cqi solid var(--pdf-line-2); border-radius:1.8cqi; text-align:center}
.v3-pix .qr{width:11.4cqi; height:11.4cqi; color:var(--pdf-ink)}
.v3-pix strong{font:800 1.5cqi/1.2 var(--f-ig)}
.v3-pix p{font-size:1.04cqi; line-height:1.4}
.v3-pix p b{font-weight:800}

/* Dados do cliente, no formato da fatura atual */
.v3-client{display:grid; grid-template-columns:2fr 1fr 1fr; gap:1.3cqi}
.v3-field{display:flex; flex-direction:column; gap:.6cqi; min-width:0}
.v3-field > span{font:800 .95cqi/1 var(--f-ig); letter-spacing:.04em; text-align:center}
.v3-field > div{display:flex; flex-direction:column; justify-content:center; min-height:6.2cqi; padding:1.1cqi 1.6cqi; border:.15cqi solid var(--v3-outline); border-radius:1.2cqi; font-size:1.12cqi; line-height:1.4}
.v3-field > div b{font-size:1.32cqi; font-weight:700}
.v3-field.c > div{align-items:center; font-size:1.4cqi; font-weight:700}

/* Banner iGreen Club */
.v3-club{display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:2.4cqi; padding:1.8cqi 2.4cqi; border-radius:1.6cqi; background:linear-gradient(90deg, var(--v3-frame-2), var(--v3-box)); color:var(--ig-white)}
.v3-club-logo{display:flex; flex-direction:column; align-items:flex-end; line-height:1}
.v3-club-logo img{display:block; height:4.6cqi; width:auto; filter:brightness(0) invert(1)}
.v3-club-logo span{margin-top:-.1cqi; font:600 1.4cqi/1 var(--f-ig)}
.v3-club b{display:block; font:800 1.38cqi/1.25 var(--f-ig); letter-spacing:.02em}
.v3-club p{margin-top:.35cqi !important; font-size:1.1cqi}
.v3-stores{display:flex; gap:.9cqi}
.v3-stores img{display:block; height:3.5cqi; width:auto}

/* Histórico e blocos laterais */
.v3-cols{display:grid; grid-template-columns:1.28fr 1fr; gap:1.5cqi; align-items:stretch}
.v3-hist, .v3-info{min-width:0; padding:1.8cqi 2cqi; border:.15cqi solid var(--v3-outline); border-radius:1.6cqi}
.v3-h{display:block; margin-bottom:1.1cqi; font:800 1.12cqi/1.2 var(--f-ig); letter-spacing:.04em; color:var(--v3-ink)}
.v3-t{width:100%; border-collapse:collapse; font-size:1.22cqi; font-variant-numeric:tabular-nums}
.v3-t th{padding:0 .6cqi .8cqi; text-align:left; vertical-align:bottom; font:800 .84cqi/1.25 var(--f-ig); letter-spacing:.03em; color:var(--pdf-muted)}
.v3-t td{padding:1.32cqi .6cqi; border-top:.12cqi solid var(--pdf-line); vertical-align:middle}
.v3-t th:last-child, .v3-t td:last-child{text-align:right}
.v3-t tr.now td{background:var(--v2-tint); font-weight:800}
.v3-t tr.now td:first-child{border-radius:.8cqi 0 0 .8cqi}
.v3-t tr.now td:last-child{border-radius:0 .8cqi .8cqi 0}
.v3-t small{display:block; font-size:.82cqi; font-weight:600; color:var(--pdf-muted)}
.v3-cred{display:flex; align-items:center; gap:.9cqi}
.v3-cred > span:first-child{min-width:3ch}
.v3-bar{flex:1; height:.7cqi; border-radius:1cqi; background:var(--pdf-faint); overflow:hidden}
.v3-bar i{display:block; height:100%; border-radius:1cqi; background:var(--pdf-bar)}
.v3-t tr.now .v3-bar i{background:var(--ig-green)}
.v3-late{color:var(--warn)}
.v3-foot{margin-top:.9cqi !important; font-size:.9cqi; color:var(--pdf-muted)}
.v3-side{display:flex; flex-direction:column; gap:1.5cqi; min-width:0}
.v3-info{flex:1}
.v3-info p{font-size:1.15cqi; line-height:1.5}
.v3-info b{font-weight:800}

/* Boleto: preto e branco, dados mínimos + código de barras */
.v3-bol{margin-top:auto; display:flex; flex-direction:column; gap:1cqi; padding:1.4cqi 1.7cqi; border-radius:1.4cqi; background:var(--v3-gray)}
.v3-bol-f{display:grid; grid-template-columns:1.5fr 1.7fr 1fr 1fr; gap:.12cqi; background:var(--fc-ink); border:.12cqi solid var(--fc-ink); font-family:Arial, "Helvetica Neue", sans-serif; color:var(--fc-ink)}
.v3-bol-f div{display:flex; flex-direction:column; gap:.2cqi; min-width:0; padding:.6cqi .9cqi; background:var(--pdf-paper)}
.v3-bol-f span{font-size:.82cqi}
.v3-bol-f b{font-size:1.12cqi; overflow-wrap:anywhere}
.v3-bol-f .r b{text-align:right}
.v3-bars-row{display:flex; flex-direction:column; gap:.7cqi; padding:1.1cqi 1.5cqi; border-radius:.8cqi; background:var(--pdf-paper)}
.v3-bars{width:49cqi; height:6.2cqi}
.v3-bars svg{display:block; width:100%; height:100%; fill:var(--fc-ink)}
.v3-line{font:700 1.45cqi/1 var(--f-code); color:var(--fc-ink); letter-spacing:.01em; white-space:nowrap}

/* ---------- Fatura PDF V4: modo geral da V3 + gráfico, passos e ficha da V2 ---------- */
.v3-page.v4{gap:1.5cqi; padding:3.2cqi 3.4cqi 2.8cqi}
.v4-head{display:flex; justify-content:space-between; align-items:flex-start; gap:2.4cqi; padding-bottom:1.1cqi; border-bottom:.2cqi solid var(--v3-box)}
.v4-ref{display:flex; flex-direction:column; align-items:flex-end; gap:.45cqi; padding-top:.5cqi; text-align:right}
.v4-ref strong{margin-bottom:.2cqi; font:800 2.2cqi/1.15 var(--f-ig)}
.v4-ref span{font-size:1.08cqi; color:var(--pdf-muted)}
.v4 .v3-total, .v4 .v3-cash{padding:1.7cqi 2.1cqi}
.v4-two{grid-template-columns:1.1fr 1fr 1fr; padding:1.2cqi 2cqi; border-radius:1.6cqi; background:var(--v2-tint)}
.v4-two h4{font-size:1.35cqi}
.v4-two p{font-size:1.04cqi}
.v4-two .v2-n{width:2.6cqi; height:2.6cqi; background:var(--v3-box); font-size:1.15cqi}
.v4-two .v2-bill b{font-size:1.2cqi}
.v4-two .v2-bill > div > span{font-size:1.04cqi}
.v4 .v3-field > div{min-height:5.4cqi}
.v4-mid{display:grid; grid-template-columns:1.3fr 1fr; gap:1.5cqi; align-items:stretch}
.v4-panel{padding:1.7cqi 2cqi; border-color:var(--v3-outline); border-radius:1.6cqi}
.v4-panel h4{margin-bottom:1cqi; font-size:1.25cqi}
.v4-panel .v2-insight{font-size:1.08cqi}
.v4 .v3-side{gap:1.3cqi}
.v4 .v3-fraud{margin-top:1.1cqi; padding:2.1cqi 1.8cqi 1.3cqi}
.v4 .v3-fraud p, .v4 .v3-info p{font-size:1.06cqi}
.v4 .v3-info{padding:1.5cqi 1.8cqi}
.v4 .v3-club{padding:.9cqi 2cqi}
/* V4 compacta para caber no A4 com a ficha no padrão (95 a 108 mm) */
.v3-frame:has(> .v4){padding:1.8cqi 1.8cqi 0}
.v3-frame:has(> .v4) .v3-slogan{padding:1.4cqi 0 1.5cqi; font-size:1.5cqi}
.v3-page.v4{gap:1.15cqi; padding:2.8cqi 3.2cqi 2.4cqi}
.v4 .v3-logo{height:4.2cqi}
.v4 .v3-issuer{margin-top:1cqi; padding:.8cqi 1.2cqi}
.v4 .v3-amount{font-size:4.5cqi}
.v4 .v3-pix{padding:1.5cqi}
.v4 .v3-pix .qr{width:10cqi; height:10cqi}
.v4 .v3-cash-val{margin-top:.9cqi; font-size:4cqi}
.v4 .v3-cash-after{max-width:62%}
.v4 .v3-mini{padding-top:1cqi}
.v4 .v3-field > div{min-height:4.6cqi; padding:.8cqi 1.4cqi}
.v4 .v3-fraud{padding:1.9cqi 1.7cqi 1.1cqi}
.v4 .v3-info{padding:1.3cqi 1.7cqi}
.v4 .v3-club-logo img{height:3.4cqi}
.v4 .v3-club-logo span{font-size:1.15cqi}
.v4 .v3-club b{font-size:1.25cqi}
.v4 .v3-stores img{height:3cqi}
.v4 .fc-f{padding:.5cqi .8cqi .6cqi}
.v4 .fc-f span{font-size:.9cqi}
.v4 .v3-club-logo img{height:4cqi}
.v4 .v2-cut{margin-top:auto}

/* ---------- Benchmark ---------- */
.bench{max-width:920px; margin-inline:auto; padding:32px 24px 48px; font-size:15px; line-height:1.6}
.bench h2{margin:40px 0 10px; font:700 21px/1.3 var(--f-ig); letter-spacing:-.01em; text-wrap:balance}
.bench h2:first-child{margin-top:0}
.bench h3{margin:22px 0 6px; font:700 15.5px/1.35 var(--f-ig)}
.bench p, .bench li{max-width:72ch}
.bench p{margin:0 0 10px}
.bench ul, .bench ol{margin:0 0 12px; padding-left:22px}
.bench li{margin-bottom:5px}
.bench .lead{font-size:16.5px; color:var(--ink)}
.bench .meta{color:var(--muted); font-size:13.5px}
.bench q{quotes:"“" "”"}
.bench sup{font-size:11px; color:var(--data); font-weight:600}
.tw{overflow-x:auto; margin:8px 0 16px; border:1px solid var(--line); border-radius:8px}
.bt{width:100%; border-collapse:collapse; font-size:13px; line-height:1.45}
.bt th{position:sticky; top:0; background:var(--hover); text-align:left; font-weight:600; padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap}
.bt td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:top; min-width:150px}
.bt td:first-child{min-width:170px; font-weight:600}
.bt tr:last-child td{border-bottom:0}
.bt .nv{color:var(--muted); font-style:italic}
.mat{display:inline-block; font-size:12px; font-weight:600; white-space:nowrap}
.mat.c{color:var(--accent)} .mat.e{color:var(--warn)} .mat.x{color:var(--removed)}
.prio{display:inline-block; min-width:28px; font-weight:700}
.p0{color:var(--removed)} .p1{color:var(--warn)} .p2{color:var(--data)} .p3{color:var(--muted)}
.csd{display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:14px; margin:8px 0 16px}
.csd > div{border:1px solid var(--line); border-radius:8px; padding:14px 16px}
.csd h3{margin-top:0}
.csd ul{margin:0}
.csd li{font-size:14px}
.src-list{font-size:13px; color:var(--muted); padding-left:28px}
.src-list li{max-width:none; overflow-wrap:anywhere}
.src-list a{color:var(--data)}
.callout{border-left:3px solid var(--accent); background:var(--hover); padding:12px 16px; border-radius:0 8px 8px 0; margin:12px 0 16px}
.callout p:last-child{margin-bottom:0}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important; transition:none !important; scroll-behavior:auto !important}
}

/* Casca no estilo do login-superapp: lista lateral agrupada, palco ao centro, controles em pílula */
:root{
  --bg:#E4E8E5; --surface:#FFFFFF; --ink:#111513; --ink-2:#3E4541; --muted:#6A726D;
  --line:#E1E5E2; --line-2:#C9D0CB; --chip:#F2F4F3; --hover:#F4F6F5;
  --accent:#338449; --accent-dark:#276638; --accent-soft:#EAF4ED; --accent-ink:#FFFFFF;
  --f-ui:"Manrope", system-ui, "Segoe UI", Roboto, Arial, sans-serif;
}
body{background:var(--bg); color:var(--ink); font:14px/1.5 var(--f-ui); margin:0}
.shell{display:grid; grid-template-columns:292px minmax(0,1fr); gap:24px; max-width:1480px; margin-inline:auto; padding:24px 24px 48px}
.side{position:sticky; top:24px; align-self:start; display:flex; flex-direction:column; max-height:calc(100dvh - 48px); overflow-y:auto; padding:2px 4px 2px 2px}
.brand{display:flex; align-items:center; gap:12px; padding:6px 8px 8px}
.brand img{display:block; width:84px; height:auto}
.brand span{padding-left:12px; border-left:1px solid var(--line-2); font:800 14px/1.25 var(--f-ui); color:var(--ink)}
.grupo{margin:18px 8px 8px; font:800 11px/1 var(--f-ui); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.lista{list-style:none; margin:0; padding:0; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:16px}
.lista li + li{border-top:1px solid var(--line)}
.item{display:flex; align-items:center; gap:10px; width:100%; padding:10px 12px; border:0; background:transparent; color:var(--ink); text-align:left; cursor:pointer; font:700 13.5px/1.35 var(--f-ui)}
.item:hover{background:var(--hover)}
.item .num{display:grid; place-items:center; flex:none; width:22px; height:22px; border-radius:11px; background:var(--chip); color:var(--ink-2); font:800 11.5px/1 var(--f-ui)}
.item[aria-current="true"]{background:var(--accent-soft); color:var(--accent-dark); font-weight:800}
.item[aria-current="true"] .num{background:var(--accent); color:var(--accent-ink)}
.item:focus-visible, .pill:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.main{display:flex; flex-direction:column; gap:14px; min-width:0}
.bar{position:sticky; top:12px; z-index:20; display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px 24px; padding:12px 16px 12px 20px; background:var(--surface); border:1px solid var(--line); border-radius:18px}
.bar h1{margin:0; font:800 16px/1.25 var(--f-ui); letter-spacing:-.01em}
.sims{display:flex; flex-wrap:wrap; align-items:center; gap:10px 22px}
.sim{display:flex; flex-wrap:wrap; align-items:center; gap:8px}
.rot{margin-right:2px; font:800 11px/1 var(--f-ui); letter-spacing:.08em; text-transform:uppercase; color:var(--muted)}
.pill{display:inline-flex; align-items:center; gap:7px; height:36px; padding:0 14px; border:1px solid var(--line-2); border-radius:18px; background:var(--surface); color:var(--ink); font:700 13.5px/1 var(--f-ui); white-space:nowrap; cursor:pointer; transition:background .15s, border-color .15s, color .15s}
.pill:hover{border-color:var(--accent)}
.pill[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.pill img, .pill svg{display:block; width:16px; height:16px; flex:none}
.pill .on{display:none}
.pill[aria-pressed="true"] .on{display:block}
.pill[aria-pressed="true"] .off{display:none}
.pill.n{min-width:52px; justify-content:center; padding:0 12px}
.stage-card{min-width:0; overflow:hidden; background:var(--surface); border:1px solid var(--line); border-radius:18px}
.legend{display:flex; flex-wrap:wrap; gap:6px 16px; padding:10px 20px; border-bottom:1px solid var(--line); font-size:12.5px; color:var(--muted)}
.legend span{display:inline-flex; align-items:center; gap:6px}
.legend i{display:inline-block; width:10px; height:10px; border-radius:2px}
.legend .r{border:1.5px dashed var(--removed)}
.legend .d{background:var(--a-data-wash); border:1px solid var(--data)}
.stage{min-width:0}
/* Porquinho animado no Invoice Web: entra com um pulo, a moeda cai no cofre e ele balança.
   Na imagem original a moeda ocupa as linhas 3 a 26 de 80 e o porquinho começa na 27 (33,75%). */
.pig-anim{position:relative; display:block; width:80px; height:80px; margin:0 auto 18px; animation:pig-in .6s cubic-bezier(.34,1.56,.64,1) both}
.pig-anim img{display:block; width:80px; height:80px}
.pig-body{clip-path:inset(33.75% 0 0 0); transform-origin:50% 100%; animation:pig-bounce 5s ease-in-out .6s infinite}
.pig-coin{position:absolute; left:0; top:-18px; width:80px; height:45px; overflow:hidden; pointer-events:none}
.pig-coin img{position:absolute; left:0; top:18px; clip-path:inset(0 0 66.25% 0); animation:coin-drop 5s ease-in-out .6s infinite backwards}
@keyframes pig-in{from{opacity:0; transform:translateY(10px) scale(.6)} to{opacity:1; transform:none}}
@keyframes coin-drop{
  0%{opacity:0; transform:translateY(-16px)}
  10%{opacity:1; transform:translateY(0)}
  14%{transform:translateY(-3px)}
  18%, 58%{transform:translateY(0)}
  64%{transform:translateY(-4px); animation-timing-function:cubic-bezier(.55,0,.9,.55)}
  76%{opacity:1; transform:translateY(26px)}
  77%, 100%{opacity:0; transform:translateY(26px)}
}
@keyframes pig-bounce{
  0%, 74%, 100%{transform:none}
  79%{transform:scale(1.07,.92)}
  86%{transform:scale(.97,1.04)}
  92%{transform:scale(1.01,.99)}
}
@media (max-width:960px){
  .shell{grid-template-columns:minmax(0,1fr); gap:16px; padding:16px}
  .side{position:static; max-height:none; overflow:visible}
  .bar{position:static}
}
</style>
</head>

  <ul>
    <li>Valor e vencimento no topo é o piso do mercado. Nubank, Octopus, Cemig, Enel e Bulbe fazem assim <sup>[22][36][40][42][47]</sup>. Numa pesquisa da PG&amp;E com clientes, 77% procuram primeiro o valor a pagar <sup>[55]</sup>, e a pesquisa da Ofgem chegou ao mesmo ponto: o cliente procura primeiro a cobrança e o pagamento <sup>[52]</sup>.</li>
    <li>O benefício funciona melhor como um valor com nome próprio dentro da conta, com o acumulado ao lado. A Octopus faz isso com créditos e o PicPay mostra a parte do saldo que veio de cashback <sup>[46][47]</sup>. Entre os concorrentes, só a Lemon põe a economia do mês na própria fatura. Os outros mandam para o app <sup>[12][14][25]</sup>.</li>
    <li>O Pix já sobe para perto do valor nas distribuidoras <sup>[36][40]</sup>. O Inter acrescenta uma dica para conferir o recebedor <sup>[44]</sup>.</li>
    <li>"Quantas contas eu pago?" é a dúvida principal em todos os players de energia por assinatura, e "cobrança indevida" é a reclamação nº 1 em todos eles <sup>[5][15][19][23][26]</sup>. Nenhum explica isso na própria fatura. É a oportunidade mais clara.</li>
    <li>A ficha de compensação é rígida: fundo branco, impressão azul ou preta, posições fixas <sup>[32]</sup>. O resto da página é livre. O boleto precisa trazer as condições de desconto por pagamento em dia <sup>[31]</sup>, o que encaixa a regra dos 10%.</li>
    <li>O Banco Central pede a grafia "Pix". "PIX" só vale em texto todo em maiúsculas <sup>[33]</sup>, e isso afeta o nome "PIX da Energia".</li>
    <li>Maior risco: o card tira o "Quanto pagaria sem iGreen", que é como a iGreen explica a economia hoje <sup>[7]</sup>. Sem essa âncora, o benefício precisa de outra prova na página.</li>
  </ul>

  <h3>Como funciona a cobrança da iGreen hoje</h3>
  <ul>
    <li><b>Duas contas na maioria dos casos.</b> A distribuidora cobra a taxa mínima, a iluminação pública, os impostos e o consumo que passa da energia injetada. A iGreen cobra a energia injetada com desconto <sup>[2][6]</sup>. Na Cemig existe um boleto unificado opcional <sup>[4]</sup>.</li>
    <li><b>O boleto atual</b>, pela descrição oficial, mostra o consumo, o valor com desconto, o "valor que você pagaria" e o histórico de economia <sup>[6][7]</sup>. Não achamos imagem pública do PDF.</li>
    <li><b>Desconto:</b> até 20% <sup>[1]</sup>. Um contrato analisado pelo Procon-MPMG prevê 16% com pagamento em dia e 10% depois do vencimento <sup>[9]</sup>, que é a base provável da regra dos 10%.</li>
    <li><b>Cashback já existe:</b> vem de indicação e abate o próximo boleto <sup>[3]</sup>. "Pix da Energia" não aparece em nenhum material público. É um produto novo.</li>
    <li><b>Reclame Aqui (abr a set/2026):</b> 3.284 reclamações e reputação "Ótima". Os problemas mais citados são cobrança indevida, cancelamento e propaganda enganosa. Títulos recorrentes: "recebo duas contas", "o desconto não aparece" e boleto de uma empresa que o cliente não reconhece, já que a venda passa por licenciados <sup>[5][10]</sup>. O Procon-MG cita falta de clareza sobre as duas contas mensais <sup>[9]</sup>. A própria iGreen explica que a distribuidora leva de 2 a 3 ciclos para incluir o cliente no rateio <sup>[8]</sup>.</li>
  </ul>

  <h3>Porém e riscos</h3>
  <ul>
    <li><b>Âncora removida.</b> Sem o "Quanto pagaria sem iGreen" <sup>[7]</sup>, o cliente pode não ver o benefício, o que alimenta o "desconto não aparece" <sup>[5]</sup>. Concorrentes que tiram a âncora da fatura levam a prova para o app <sup>[14][25]</sup>, e mesmo assim clientes da Cemig SIM relatam não conseguir conferir a economia prometida <sup>[20]</sup>.</li>
    <li><b>Marca Pix no nome do produto.</b> A grafia já foge do manual <sup>[33]</sup>. Usar a marca Pix no nome de um produto de terceiro precisa de checagem jurídica.</li>
    <li><b>Comparação com vizinhos.</b> Reduz o consumo em cerca de 2% em média, com efeito bumerangue em quem já consome pouco <sup>[50]</sup>. Em Nova York, mais de um terço dos domicílios preferia não receber o relatório <sup>[51]</sup>.</li>
    <li><b>QR demais.</b> A conta da CPFL tem três QR Codes <sup>[38]</sup>. Interpretação: aumenta a chance de o cliente escanear o errado.</li>
    <li><b>Mensagem de economia é publicidade.</b> Precisa ser comprovável <sup>[30]</sup>. "Propaganda enganosa" já tem 350 reclamações na iGreen <sup>[5]</sup>.</li>
    <li><b>Fatura única com repasse</b> (Bulbe, Lemon) resolve as duas contas, mas gera queixa de valor pago e não repassado <sup>[23]</sup>.</li>
  </ul>

  <h3>Síntese</h3>
  <p><b>Convergências.</b> Valor e vencimento no topo. Pix na fatura. Histórico de 12 a 13 meses em barras. Linguagem simples, falando com "você".</p>
  <p><b>Divergências.</b> Onde fica a prova de economia: na fatura (Lemon, iGreen hoje) ou no app (Cemig SIM, Órigo). Uma ou duas contas: a fatura única depende de acordo com a distribuidora, o que explica a diferença entre os players.</p>
  <p><b>Lacunas.</b> Ninguém explica as duas contas dentro da própria fatura. Ninguém mostra na fatura o benefício acumulado desde a adesão. Ninguém mostra claramente os dois valores, até e depois do vencimento.</p>
  <p><b>Anti-padrões.</b> Grafia "PIX" em texto misto (Cemig, CPFL) <sup>[33]</sup>. Três QR Codes na mesma página (CPFL) <sup>[38]</sup>. Chamadas para o app que ficam fora da conta, onde o cliente não vê (CPFL) <sup>[38]</sup>.</p>

  <h3>O que a pesquisa produziu</h3>
  <div class="csd">
    <div><h3>Certezas</h3><ul>
      <li>O cliente iGreen recebe duas cobranças por mês na maioria dos casos <sup>[2][6]</sup>.</li>
      <li>"Cobrança indevida" é a reclamação nº 1 na iGreen e nos quatro concorrentes <sup>[5][15][19][23][26]</sup>.</li>
      <li>A ficha de compensação precisa de fundo branco e impressão azul ou preta <sup>[32]</sup>.</li>
      <li>O boleto deve trazer as condições de desconto por pagamento antecipado <sup>[31]</sup>.</li>
      <li>A grafia oficial é "Pix" <sup>[33]</sup>.</li>
      <li>A iGreen já tem cashback que abate o boleto <sup>[3]</sup>.</li>
    </ul></div>
    <div><h3>Suposições</h3><ul>
      <li>Benefício do mês e acumulado no topo reduzem o "desconto não aparece", porque hoje a prova é a âncora que o card remove. Validar com teste de 5 segundos e acompanhando o Reclame Aqui por 3 ciclos. Prioridade alta.</li>
      <li>Um bloco sobre as duas contas reduz a sensação de cobrança em dobro. Validar com teste de compreensão e com o volume de "cobrança duplicada". Prioridade alta.</li>
      <li>Pix ao lado do valor aumenta o pagamento por Pix. Validar comparando a participação do Pix antes e depois. Prioridade média.</li>
      <li>Mostrar os dois valores (até e após) incentiva pagar em dia sem confundir, desde que o valor até o vencimento seja o maior número da página. Validar com teste de compreensão. Prioridade média.</li>
    </ul></div>
    <div><h3>Dúvidas</h3><ul>
      <li>Um produto de terceiro pode usar a marca Pix no nome? Como descobrir: jurídico, a partir do manual da marca <sup>[33]</sup>.</li>
      <li>Como o Pix da Energia funciona: o valor volta por Pix, quando e para qual chave? Como descobrir: regra de negócio com o PO.</li>
      <li>De onde vem o valor do benefício e o acumulado? Como descobrir: dados e DataScience.</li>
      <li>Como se calcula o valor após o vencimento? Como descobrir: SKILL_RCB_SEC3.</li>
      <li>O banco emissor aceita boleto com QR Pix (híbrido)? Como descobrir: financeiro com o banco <sup>[35]</sup>.</li>
      <li>O CDC vale para membros de consórcio ou cooperativa? Como descobrir: parecer jurídico.</li>
    </ul></div>

  <h3>Recomendação para a iGreen</h3>
  <p><b>Adotar.</b> Valor, vencimento e situação no topo. Pix perto do valor, com cópia do código na fatura online. Histórico de 13 meses. Ficha de compensação no padrão, com o desconto por pontualidade. Identificação do fornecedor. Linguagem simples.</p>
  <p><b>Considerar, com risco explícito.</b> Benefício acumulado: depende de dado confiável, porque o número vira promessa. Bloco das duas contas: precisa de texto validado com atendimento. Dica de conferência do recebedor junto ao QR.</p>
  <p><b>Evitar.</b> Ranking com vizinhos. Mais de um QR Code na página. Âncora "de/por" ou economia sem base demonstrável. "PIX" em texto misto. Cor de marca dentro da ficha de compensação.</p>

  /* ---------- Peças compartilhadas pelos PDFs V2, V3 e V4 ---------- */
  function barChart(o){
    const n = o.vals.length, H = o.h || 112, x0 = 26, slot = 22.4, bw = 13, base = H - 20, k = (H - 36)/o.max;
    let s = '';
    o.grid.forEach(g => {
      const y = base - g*k;
      s += '<line class="gl" x1="' + (x0-4) + '" x2="' + (x0+slot*n) + '" y1="' + y + '" y2="' + y + '"/>';
      s += '<text class="ax" x="' + (x0-7) + '" y="' + (y+2.4) + '" text-anchor="end">' + g + '</text>';
    });
    o.vals.forEach((v,i) => {
      const h = v*k, x = x0 + i*slot + (slot-bw)/2, last = i === n-1, first = i === 0;
      s += '<rect class="bar' + (last ? ' now' : '') + '" x="' + x.toFixed(1) + '" y="' + (base-h).toFixed(1) + '" width="' + bw + '" height="' + h.toFixed(1) + '" rx="2"/>';
      s += '<text class="ax' + (last ? ' b' : '') + '" x="' + (x+bw/2).toFixed(1) + '" y="' + (base+10) + '" text-anchor="middle">' + o.months[i] + '</text>';
      if(first || last){
        s += '<text class="ax' + (last ? ' b' : '') + '" x="' + (x+bw/2).toFixed(1) + '" y="' + (base+17.5) + '" text-anchor="middle">' + (first ? o.years[0] : o.years[1]) + '</text>';
        s += '<text class="ax b" x="' + (x+bw/2).toFixed(1) + '" y="' + (base-h-3.5).toFixed(1) + '" text-anchor="middle">' + v + '</text>';
      }
    });
    return '<svg class="chart" viewBox="0 0 ' + (x0+slot*n+4) + ' ' + H + '" role="img" aria-label="' + o.label + '">' + s + '</svg>';
  }

      years:['2025','2026'], grid:[0,100,200,300], max:400, h:88,
      label:'Energia verde compensada nos últimos 13 meses, em kWh'
    });
    const instr = (c.split
      ? 'Fatura cobrada pelo valor cheio. O cashback de ' + brl(c.ate) + ' (pagando até ' + B3.venc + ') ou de ' + brl(c.apos) + ' (depois) é creditado no iGreen Club e não é abatido deste boleto.'
      : 'Fatura cobrada pelo valor cheio. O cashback de ' + brl(c.ate) + ' é creditado no iGreen Club após o pagamento e não é abatido deste boleto.') +
      '<br>Após o vencimento, cobrar multa e juros conforme o contrato.';

    return pdfSheet('Fatura PDF V4, folha A4', v3Frame('v4',
      '<header class="v4-head">' + b.issuer +
        '<div class="v4-ref"><strong>Fatura de novembro de 2026</strong><span>Mês de referência ' + B3.ref + '</span><span>Nº 000.184.552 · Emissão 20/11/2026</span></div>' +
      '</header>' +
      b.ghost + b.hero +
      '<section class="v2-two v4-two">' +
        '<div><h4>Você recebe duas contas por mês</h4><p>Não é cobrança em dobro. Cada conta cobra uma parte diferente da sua energia. Pague as duas.</p></div>' +
        '<div class="v2-bill"><span class="v2-n">1</span><div><b>Esta fatura, da iGreen</b><span>Energia verde injetada: ' + B3.kwh + ' kWh, no valor de ' + brl(B3.base) + '.</span></div></div>' +
        '<div class="v2-bill"><span class="v2-n">2</span><div><b>Conta da CEMIG</b><span>Taxa mínima, iluminação pública e impostos. Chega separada e é paga à CEMIG.</span></div></div>' +
      '</section>' +
      '<section class="v3-client">' +
        '<div class="v3-field"><span>DADOS DO CLIENTE</span><div><b>Cliente Exemplo da Silva</b>000.000.000-00 · Rua Exemplo, 100 · Centro · Uberlândia - MG</div></div>' +
        '<div class="v3-field c"><span>NÚMERO DE INSTALAÇÃO</span><div>3000000000</div></div>' +
        '<div class="v3-field c"><span>DISTRIBUIDORA</span><div>CEMIG</div></div>' +
      '</section>' +
      '<section class="v4-mid">' +
        '<div class="v2-panel v4-panel"><h4>Sua energia verde nos últimos 13 meses (kWh)</h4>' + chart +
          '<p class="v2-insight">Novembro: <b>' + B3.kwh + ' kWh</b>, 3% a mais que em novembro de 2025.</p>' + b.tag('RCB_CLIENTES.energiacompensada') + '</div>' +
        '<div class="v3-side">' + b.fraud + b.info + '</div>' +
      '</section>' +
      b.club +
      '<div class="v2-cut">Ficha de compensação</div>' +
      fichaHTML({value:B3.base, desc:0, instr, venc:B3.venc, date:'20/11/2026', factor:'1071', seed:11,
        payer:'Cliente Exemplo da Silva · CPF 000.000.000-00 · Rua Exemplo, 100, Centro, Uberlândia - MG'})));
  }

  /* ---------- Benchmark ---------- */
  function benchStage(){
    return '<article class="bench">' + document.getElementById('bench-tpl').innerHTML + '</article>';
  }


  /* ---------- Navegação e controles ---------- */
  const NAV = {
    'web-desktop':{surface:'web', device:'desktop', title:'Invoice Web · Desktop'},
    'web-mobile':{surface:'web', device:'mobile', title:'Invoice Web · Mobile'},
    'pdf-v1':{surface:'pdf', title:'Fatura PDF V1'},
    'pdf-v2':{surface:'pdf3', title:'Fatura PDF V2'},
    'pdf-v3':{surface:'pdf4', title:'Fatura PDF V3'},
    'bench':{surface:'bench', title:'Benchmark'}
  };
  let current = 'web-desktop';
  const $ = id => document.getElementById(id);
  const stage = $('stage');
  $('brand-logo').src = A['logo.svg'];

  function render(){
    const nav = NAV[current];
    S.surface = nav.surface;
    if(nav.device) S.device = nav.device;
    const web = S.surface === 'web', bench = S.surface === 'bench';
    document.querySelectorAll('[data-go]').forEach(b => b.setAttribute('aria-current', String(b.dataset.go === current)));
    document.querySelectorAll('[data-var]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.var === S.variant)));
    document.querySelectorAll('[data-disc]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.disc === S.disc)));
    document.querySelectorAll('[data-tog]').forEach(b => b.setAttribute('aria-pressed', String(!!S[b.dataset.tog])));
    $('g-var').hidden = bench;
    $('g-disc').hidden = web || bench;
    $('g-show').hidden = bench;
    $('title').textContent = nav.title;
    const leg = [];
    if(!bench && S.removed) leg.push('<span><i class="r"></i>Removido</span>');
    if(!bench && S.data) leg.push('<span><i class="d"></i>Coluna do banco</span>');
    $('legend').innerHTML = leg.join('');
    $('legend').hidden = !leg.length;
    stage.innerHTML = {web:webStage, pdf:pdfStage, pdf3:pdf3Stage, pdf4:pdf4Stage, bench:benchStage}[S.surface]();
    placeNotch();
  }

  /* Alinha o recorte lateral do ticket com a linha tracejada antes do total */
  function placeNotch(){
    const card = stage.querySelector('.ig-card'), tear = card && card.querySelector('.ig-tear');
    if(!tear) return;
    const y = tear.getBoundingClientRect().top - card.getBoundingClientRect().top + tear.offsetHeight/2;
    card.style.setProperty('--ny', y.toFixed(1) + 'px');
  }
  window.addEventListener('resize', placeNotch);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(placeNotch);
  window.addEventListener('load', placeNotch);
  stage.addEventListener('load', placeNotch, true);

  let toastT;
  function toast(msg){
    const t = $('toast');
    t.innerHTML = img('icon-check.svg', 24) + '<span></span>';
    t.lastChild.textContent = msg;
    t.hidden = false;
    clearTimeout(toastT);
    toastT = setTimeout(() => { t.hidden = true; }, 2600);
  }
  function copy(text){
    try { navigator.clipboard.writeText(text).catch(() => {}); } catch(e) {}
  }
  const actions = {
    pix(){ S.pixOpen = !S.pixOpen; render(); },
    pixcopy(){ copy('PIX-ILUSTRATIVO-000184552'); toast('Código Pix copiado'); },
    barcode(){ copy(linha()); toast('Código de barras copiado para a área de transferência'); },
    open(){ current = 'pdf-v3'; render(); window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'}); },
    download(){ toast('No produto, este botão baixa o PDF do boleto'); },
    card(){ toast('No produto, este botão abre o pagamento com cartão de crédito'); }
  };

  document.addEventListener('click', e => {
    const go = e.target.closest('[data-go]');
    if(go){ current = go.dataset.go; S.pixOpen = false; render(); window.scrollTo({top:0, behavior: reduce ? 'auto' : 'smooth'}); return; }
    const vr = e.target.closest('[data-var]');
    if(vr){ S.variant = vr.dataset.var; render(); return; }
    const ds = e.target.closest('[data-disc]');
    if(ds){ S.disc = +ds.dataset.disc; render(); return; }
    const tg = e.target.closest('[data-tog]');
    if(tg){ S[tg.dataset.tog] = !S[tg.dataset.tog]; render(); return; }
    const act = e.target.closest('[data-act]');
    if(act && actions[act.dataset.act]) actions[act.dataset.act]();
  });

  render();
})();
</script>
</body>
</html>
