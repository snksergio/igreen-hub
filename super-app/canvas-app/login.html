<script>
const DADOS = {"quadros":[{"id":"LgMapa","x":0,"y":300,"w":1180,"h":1329,"t":"Login · Mapa dos caminhos e regras do cadastro","r":32,"html":"<div style=\"width: 1180px; height: 1329px; overflow: hidden; position: relative; isolation: isolate; background: #EEF0EF; color: #111513; font-family: 'Manrope', system-ui, sans-serif\">\n<div style=\"padding: 44px 44px 0\">\n<span style=\"font-size: 12px; font-weight: 800; letter-spacing: 0.1em; color: #545C57\">LOGIN E CADASTRO<\/span>\n<h1 style=\"margin: 8px 0 0; font-size: 34px; line-height: 40px; font-weight: 800; letter-spacing: -0.025em\">Depois do CPF, o app decide o caminho sozinho<\/h1>\n<p style=\"margin: 10px 0 0; max-width: 720px; font-size: 15px; line-height: 23px; color: #545C57\">A pessoa passa pelas boas&#8209;vindas, digita o CPF e, no último número, o app confere o cadastro. Não existe botão de \"entrar\" ou \"criar conta\": o CPF escolhe a trilha.<\/p>\n<div style=\"margin-top: 26px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap\">\n<div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Boas&#8209;vindas<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Primeiro acesso 1 a 3<\/span><\/div><span style=\"color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">CPF<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Confere sozinho no último número<\/span><\/div><span style=\"color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m9 18 6-6-6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">É cliente em algum produto?<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">E já tem primeiro acesso criado?<\/span><\/div>\n<\/div>\n<div style=\"margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start\">\n<div style=\"min-width: 0; border-radius: 24px; background: #F7F8F7; border: 1px solid #E1E5E2; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 14px; background: #DDEFE3; border: 1px solid #BBDBC5; color: #1F5F35; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; white-space: nowrap\">Cliente com acesso criado<\/span>\n<div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Senha<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Errou 3 vezes: acesso pausado por 30 min<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Ativar biometria<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Opcional<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #DDEFE3; border: 1px solid #BBDBC5; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #1F5F35\">Home de sempre<\/span><\/div>\n<\/div>\n<div style=\"min-width: 0; border-radius: 24px; background: #F7F8F7; border: 1px solid #E1E5E2; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 14px; background: #FFEBD3; border: 1px solid #F1CFA0; color: #8A5300; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; white-space: nowrap\">Cliente iGreen sem primeiro acesso<\/span>\n<div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Código no canal do cadastro<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">SMS, WhatsApp ou e&#8209;mail ligados ao CPF<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Código de 6 dígitos<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Criar senha<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Ativar biometria<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Opcional<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #DDEFE3; border: 1px solid #BBDBC5; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #1F5F35\">Home de sempre<\/span><\/div>\n<\/div>\n<div style=\"min-width: 0; border-radius: 24px; background: #F7F8F7; border: 1px solid #E1E5E2; padding: 14px; display: flex; flex-direction: column; gap: 8px\">\n<span style=\"align-self: flex-start; height: 28px; padding: 0 12px; border-radius: 14px; background: #FFFFFF; border: 1px solid #E1E5E2; color: #3E4541; font-size: 12.5px; font-weight: 800; display: flex; align-items: center; white-space: nowrap\">Não é cliente<\/span>\n<div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Quer recarregar num eletroposto iGreen?<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Outros produtos liberam na 1ª recarga<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Cadastro do Eletroposto<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Nome, nascimento, e&#8209;mail e WhatsApp<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Criar senha<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Sem código: a conta nasce aqui<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #FFFFFF; border: 1px solid #E1E5E2; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #111513\">Primeiro acesso 4 a 6<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Localização, notificações e o carro pela placa<\/span><\/div><span aria-hidden=\"true\" style=\"align-self: center; color: #9AA29D; display: flex\"><svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m6 9 6 6 6-6\"><\/path><\/svg><\/span><div style=\"padding: 12px 14px; border-radius: 16px; background: #DDEFE3; border: 1px solid #BBDBC5; display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 19px; font-weight: 800; color: #1F5F35\">Home do Eletroposto<\/span><span style=\"font-size: 12.5px; line-height: 17px; color: #545C57\">Motorista abre direto no Eletroposto<\/span><\/div>\n<\/div>\n<\/div>\n<div style=\"margin-top: 26px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start\">\n<div style=\"border-radius: 24px; background: #FFFFFF; border: 1px solid #E1E5E2; padding: 20px 22px\">\n<h2 style=\"margin: 0; font-size: 18px; line-height: 24px; font-weight: 800\">Regras do cadastro pelo app<\/h2>\n<ul style=\"margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px\">\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Começa pelo Eletroposto (iGreen MOB)<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">O cadastro inicial é só do Eletroposto: o cliente precisa nascer ligado a um idConsultor, e esse vínculo vem na primeira recarga.<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">CPF, e&#8209;mail e celular únicos<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">O CPF não pode existir em CLIENTES. E&#8209;mail e celular não podem estar ligados a outro CPF.<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Sem código por SMS ou e&#8209;mail<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">Com os dados e a senha, a conta é criada na hora e entra em CLIENTES LEADS.<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Carro: a placa vem primeiro<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">No passo 6, a placa preenche marca e modelo. Carro sem placa escolhe na lista; se não estiver lá, pede o cadastro do modelo.<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Senha<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">Campo aberto, com letras e números: pelo menos 8 caracteres e diferente da data de nascimento.<\/span><\/li>\n<\/ul>\n<\/div>\n<div style=\"border-radius: 24px; background: #FFFFFF; border: 1px solid #E1E5E2; padding: 20px 22px\">\n<h2 style=\"margin: 0; font-size: 18px; line-height: 24px; font-weight: 800\">Depois do cadastro (sistema)<\/h2>\n<ul style=\"margin: 14px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 14px\">\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Outros produtos depois da 1ª recarga<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">Depois da primeira recarga, o motorista pede energia, telecom, seguros e Club direto no app, sem consultor.<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Vínculo na primeira recarga<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">O motorista fica ligado ao consultor do eletroposto onde fez a primeira recarga (exemplo: id 2).<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Vale por 7 dias<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">Converteu em outro produto nesse prazo? Fica com o id 2 para sempre. Não converteu? Perde o vínculo e, no próximo eletroposto, ganha outro (exemplo: id 3).<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Club Certo<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">Na primeira recarga vira associado por 30 dias, renovados a cada recarga ou contratação de produto.<\/span><\/li>\n<li style=\"display: flex; flex-direction: column; gap: 2px\"><span style=\"font-size: 14px; line-height: 20px; font-weight: 800\">Home do motorista<\/span><span style=\"font-size: 13px; line-height: 19px; color: #545C57\">Quem só tem o Eletroposto abre o app direto no universo do Eletroposto.<\/span><\/li>\n<\/ul>\n<\/div>\n<\/div>\n<\/div>\n<div style=\"height: 44px\"><\/div>\n<\/div>","css":"html,body{overflow:hidden}body{margin:0;background:#EEF0EF}button{font-family:inherit;cursor:pointer;padding:0}"},{"id":"LgCpf","x":0,"y":3673,"w":390,"h":844,"t":"Login · CPF (digitando)","r":40,"html":"<div style=\"width: 390px; height: 844px; overflow: hidden; position: relative; isolation: isolate; background: #EEF0EF; color: #111513; font-family: 'Manrope', system-ui, sans-serif\">\n<div style=\"height: 50px\"><\/div>\n<header style=\"height: 48px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px\"><button aria-label=\"Voltar\" style=\"width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #E1E5E2; background: #FFFFFF; color: #111513; display: flex; align-items: center; justify-content: center\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"m12 19-7-7 7-7\"><\/path><path d=\"M19 12H5\"><\/path><\/svg><\/button><button aria-label=\"Ajuda com a conta\" style=\"width: 44px; height: 44px; flex-shrink: 0; border-radius: 22px; border: 1px solid #E1E5E2; background: #FFFFFF; color: #111513; display: flex; align-items: center; justify-content: center\"><svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\/circle><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"><\/path><path d=\"M12 17h.01\"><\/path><\/svg><\/button><\/header>\n<div style=\"margin-top: 10px; padding: 0 24px\">\n ight: 54px; flex-shrink: 0; border-radius: 27px; border: 0; background: #338449; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px\">Começar agora<\/button><\/div>\n<button style=\"margin-top: 4px; width: 100%; height: 48px; border: 0; background: transparent; color: #FFFFFF; font-size: 14.5px; font-weight: 700\">Só quero dar uma olhada<\/button>\n<\/div>\n<\/div>","css":"html,body{overflow:hidden}body{margin:0;background:#EEF0EF}button{font-family:inherit;cursor:pointer;padding:0}"}],"titulos":[{"x":0,"y":0,"w":1180,"t":"Login · como o app decide o caminho depois do CPF, e as regras do cadastro"},{"x":0,"y":1929,"w":1330,"t":"Login · boas-vindas (Primeiro acesso 1 a 3), selo Eletroposto com o G da iGreen num círculo verde"},{"x":1490,"y":1929,"w":1800,"t":"Login · boas-vindas numa tela só · rodada 1: 4 propostas para apresentar o ecossistema iGreen no lugar das 3 telas"},{"x":3530,"y":1929,"w":1800,"t":"Login · boas-vindas numa tela só · rodada 2: a pessoa dentro de um mundo iGreen, tudo verde e conectado"},{"x":5570,"y":1929,"w":2270,"t":"Login · boas-vindas numa tela só · rodada 3: pessoa em destaque e o mundo iGreen de verdade em volta, sem linhas"},{"x":8080,"y":1929,"w":1800,"t":"Login · boas-vindas numa tela só · rodada 4: o ecossistema inteiro em miniatura, fácil de ler, ao lado da pessoa"},{"x":10120,"y":1929,"w":2270,"t":"Login · boas-vindas numa tela só · rodada 5: no estilo das campanhas iGreen (verde vivo, G atrás, objetos 3D dos serviços)"},{"x":12616,"y":1897,"w":2740,"t":"Login · boas-vindas numa tela só · rodada 7: campanha 3D refeita num cenário esmeralda sóbrio, mais alta e maior, com cubos proporcionais"},{"x":0,"y":3373,"w":1330,"t":"Login · CPF: digitando, conferindo sozinho no último número e CPF inválido"},{"x":0,"y":4817,"w":1330,"t":"Login · já é cliente com acesso criado: senha, senha incorreta e biometria (telas que já existem)"},{"x":0,"y":6261,"w":1330,"t":"Login · cliente iGreen sem primeiro acesso: código no canal do cadastro e senha nova (telas que já existem)"},{"x":0,"y":7705,"w":3680,"t":"Login · não é cliente: cadastro só do Eletroposto (iGreen MOB), sem código"},{"x":0,"y":9939,"w":3210,"t":"Login · depois do cadastro: localização, notificações e o carro (passo 6: a placa vem primeiro e preenche marca e modelo), até a home do Eletroposto"},{"x":0,"y":12129,"w":3680,"t":"Login · passo 6, outros caminhos: placa não encontrada, sem placa, lista de modelos, busca sem resultado, cadastro à mão com conectores desenhados e o carro sem foto"}],"alvos":[]};
const vista = document.getElementById('vista'), mundo = document.getElementById('mundo');
const quadros = [];
for (const n of DADOS.titulos) { const h = document.createElement('h2'); h.className = 'titulo-linha'; h.style.cssText = 'left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px'; h.textContent = n.t; mundo.appendChild(h); }
DADOS.quadros.forEach((q, i) => {
  const el = document.createElement('section');
  el.className = 'quadro'; el.dataset.i = i; el.dataset.id = q.id;
  el.style.cssText = 'left:' + q.x + 'px;top:' + q.y + 'px;width:' + q.w + 'px;height:' + q.h + 'px;border-radius:' + q.r + 'px';
  const rot = document.createElement('span'); rot.className = 'rotulo'; rot.textContent = q.t; el.appendChild(rot);
  const tela = document.createElement('div'); tela.style.cssText = 'width:100%;height:100%;overflow:hidden;border-radius:inherit;position:relative';
  el.appendChild(tela); el._tela = tela; mundo.appendChild(el); quadros.push(el);
});
// each board is drawn in its own shadow root when it gets near the screen, so styles never mix
function desenhar(el) {
  if (el._feito) return; el._feito = true;
  const q = DADOS.quadros[+el.dataset.i];
  const raiz = el._tela.attachShadow({ mode: 'open' });
  raiz.innerHTML = '<style>:host{display:block;width:100%;height:100%;overflow:hidden;color:#111513;font-family:Manrope,system-ui,sans-serif;-webkit-user-select:none;user-select:none}button{font-family:inherit}</style><style>' + q.css + '</style>' + q.html;
  for (const b of raiz.querySelectorAll('button')) {
    const r = b.getAttribute('aria-label') || b.textContent.trim();
    const a = DADOS.alvos.find(([re]) => new RegExp(re).test(r));
    if (a) { b.dataset.alvo = a[1]; b.style.cursor = 'pointer'; }
  }
}
const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { desenhar(e.target); obs.unobserve(e.target); } }), { rootMargin: '600px' });
quadros.forEach(q => obs.observe(q));

let z = 1, px = 0, py = 0, atual = -1, volta = null;
const limita = v => Math.min(3, Math.max(0.03, v));
function aplicar() { mundo.style.transform = 'translate(' + px + 'px,' + py + 'px) scale(' + z + ')'; document.getElementById('nivel').textContent = Math.round(z * 100) + '%'; }
function zoomEm(cx, cy, f) { const nz = limita(z * f); px = cx - (cx - px) * (nz / z); py = cy - (cy - py) * (nz / z); z = nz; aplicar(); }
function caixaDe(els) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  els.forEach(q => { x0 = Math.min(x0, q.offsetLeft); y0 = Math.min(y0, q.offsetTop); x1 = Math.max(x1, q.offsetLeft + q.offsetWidth); y1 = Math.max(y1, q.offsetTop + q.offsetHeight); });
  return { x0, y0, x1, y1 };
}
function enquadrar(b, folga) {
  const W = vista.clientWidth, H = vista.clientHeight - 130;
  z = limita(Math.min((W - folga * 2) / (b.x1 - b.x0), (H - folga * 2) / (b.y1 - b.y0)));
  px = (W - (b.x1 - b.x0) * z) / 2 - b.x0 * z; py = 64 + (H - (b.y1 - b.y0) * z) / 2 - b.y0 * z; aplicar();
}
const todos = () => [...quadros, ...mundo.querySelectorAll('.titulo-linha')];
function verTudo() { atual = -1; enquadrar(caixaDe(todos()), 30); }
function inicio() {
  atual = -1;
  const b = caixaDe(todos()), W = vista.clientWidth;
  z = limita(Math.min(1, (W - 80) / (b.x1 - b.x0))); px = (W - (b.x1 - b.x0) * z) / 2 - b.x0 * z; py = 76 - b.y0 * z; aplicar();
}
function focar(i, semHash) {
  if (!quadros.length) return;
  atual = (i + quadros.length) % quadros.length;
  const q = quadros[atual];
  enquadrar({ x0: q.offsetLeft, y0: q.offsetTop - 40, x1: q.offsetLeft + q.offsetWidth, y1: q.offsetTop + Math.min(q.offsetHeight, 1000) }, 24);
  if (!semHash) history.replaceState(null, '', '#' + q.dataset.id);
}
const focarId = id => { const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i); };

// pan, pinch, no text selection
let ponteiros = new Map(), moveu = 0, d0 = 0, z0 = 1;
vista.addEventListener('selectstart', e => e.preventDefault());
vista.addEventListener('dragstart', e => e.preventDefault());
vista.addEventListener('pointerdown', e => { if (e.button === 0) e.preventDefault(); ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY }); moveu = 0; vista.classList.add('arrastando');
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = z; } });
vista.addEventListener('pointermove', e => {
  const p = ponteiros.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomEm((a.x + b.x) / 2, (a.y + b.y) / 2, (z0 * d / d0) / z); moveu += 10; return; }
  moveu += Math.abs(dx) + Math.abs(dy); px += dx; py += dy; aplicar();
  if (moveu > 4 && !vista.hasPointerCapture(e.pointerId)) vista.setPointerCapture(e.pointerId);
});
const solta = e => { ponteiros.delete(e.pointerId); if (!ponteiros.size) vista.classList.remove('arrastando'); };
vista.addEventListener('pointerup', solta); vista.addEventListener('pointercancel', solta);
vista.addEventListener('click', e => {
  if (moveu > 5) return;
  const alvo = e.composedPath().find(n => n.dataset && n.dataset.alvo);
  if (!alvo) return;
  e.preventDefault();
  const q = quadros[atual];
  if (alvo.dataset.alvo === 'voltar') { if (volta) focarId(volta); return; }
  if (q && !q.dataset.id.startsWith('Folha')) volta = q.dataset.id;
  focarId(alvo.dataset.alvo);
});
vista.addEventListener('dblclick', e => { const q = e.target.closest('.quadro'); if (q) focar(+q.dataset.i); });
vista.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomEm(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022)); else { px -= e.deltaX; py -= e.deltaY; aplicar(); } }, { passive: false });
const centro = () => [vista.clientWidth / 2, vista.clientHeight / 2];
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomEm(...centro(), 1.25); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); zoomEm(...centro(), 0.8); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); verTudo(); }
  else if (e.key === 'ArrowRight') focar(atual + 1);
  else if (e.key === 'ArrowLeft') focar(atual < 0 ? quadros.length - 1 : atual - 1);
  else if (e.key === 'Escape') verTudo();
});
document.getElementById('mais').onclick = () => zoomEm(...centro(), 1.25);
document.getElementById('menos').onclick = () => zoomEm(...centro(), 0.8);
document.getElementById('ajustar').onclick = verTudo;
document.getElementById('proxima').onclick = () => focar(atual + 1);
document.getElementById('anterior').onclick = () => focar(atual < 0 ? quadros.length - 1 : atual - 1);
// a row title is one line, as in the canvas: a longer text shrinks to fit its width
function ajustarTitulos() { for (const h of mundo.querySelectorAll('.titulo-linha')) { h.style.fontSize = '72px'; h.style.lineHeight = '84px'; const w = parseFloat(h.style.width); if (h.scrollWidth > w) { const f = Math.max(20, 72 * w / h.scrollWidth); h.style.fontSize = f + 'px'; h.style.lineHeight = Math.round(f * 1.17) + 'px'; } } }
function abrir() { const id = decodeURIComponent(location.hash.slice(1)); const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i, true); else inicio(); }
window.addEventListener('resize', () => atual < 0 ? inicio() : focar(atual, true));
window.addEventListener('hashchange', abrir);
ajustarTitulos();
abrir();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ajustarTitulos(); if (atual < 0) inicio(); });
</script>
