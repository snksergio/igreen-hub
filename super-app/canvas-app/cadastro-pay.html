; font-size: 14.5px; line-height: 20px; font-weight: 800; color: #8A928D\">Aprovação<\/span><span style=\"display: block; margin-top: 1px; font-size: 12.5px; line-height: 17px; color: #9AA29D; text-wrap: pretty\">Você recebe o resultado no app e por e&#8209;mail<\/span><\/div><div role=\"listitem\" style=\"position: relative; min-height: 38px; padding-left: 34px; padding-bottom: 0px\"><span style=\"position: absolute; left: 0; top: 0\"><span style=\"width: 22px; height: 22px; box-sizing: border-box; border-radius: 11px; border: 2px solid #D3D9D5; background: #FFFFFF; display: block\"><\/span><\/span><span style=\"display: block; font-size: 14.5px; line-height: 20px; font-weight: 800; color: #8A928D\">Conta Pay liberada<\/span><span style=\"display: block; margin-top: 1px; font-size: 12.5px; line-height: 17px; color: #9AA29D; text-wrap: pretty\">Pix, boletos e pagamentos pelo app<\/span><\/div><\/div><\/div><div role=\"note\" style=\"padding: 10px 10px 12px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 13px; line-height: 18px; font-weight: 700; color: #6F4300\"><span style=\"flex-shrink: 0; width: 24px; height: 24px; border-radius: 12px; background: rgba(255,255,255,0.75); box-shadow: 0 1px 2px rgba(17,21,19,0.06); display: flex; align-items: center; justify-content: center\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M10.268 21a2 2 0 0 0 3.464 0\"><\/path><path d=\"M3.262 15.326A1 1 0 0 0 4 17h16a1 1 0 0 0 .74-1.673C19.41 13.956 18 12.499 18 8A6 6 0 0 0 6 8c0 4.499-1.411 5.956-2.738 7.326\"><\/path><\/svg><\/span><span style=\"text-wrap: pretty\">Resposta em até 2 dias úteis<\/span><\/div><\/div><\/div>\n<div style=\"position: absolute; left: 0; right: 0; bottom: 0; padding: 20px 16px 22px; background: linear-gradient(180deg, rgba(238,240,239,0) 0%, #EEF0EF 34%)\">\n<a href=\"PayInicio.dc.html\" style=\"width: 100%; height: 54px; box-sizing: border-box; border-radius: 27px; background: #338449; color: #FFFFFF; font-size: 16px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 8px\">Ir para o início<\/a><button style=\"margin-top: 4px; width: 100%; height: 48px; border: 0; background: transparent; color: #3E4541; font-size: 14.5px; font-weight: 700\">Falar com o suporte<\/button>\n<\/div>\n<\/div>","css":"html,body{overflow:hidden}body{margin:0;background:#EEF0EF}button{font-family:inherit;cursor:pointer;padding:0}"}],"titulos":[{"x":0,"y":0,"w":4150,"t":"Cadastro Pay · 1 · Entrada: vantagens, selfie e o titular (CPF ou CNPJ)"},{"x":0,"y":1624,"w":4150,"t":"Cadastro Pay · 2 · Pessoa física em 3 etapas: Dados, Endereço e Perfil"},{"x":0,"y":4912,"w":3680,"t":"Cadastro Pay · 3 · Empresa em 3 etapas: Empresa, Contato e Sócios"}],"alvos":[]};
const vista = document.getElementById('vista'), mundo = document.getElementById('mundo');
const quadros = [];
for (const n of DADOS.titulos) { const h = document.createElement('h2'); h.className = 'titulo-linha'; h.style.cssText = 'left:' + n.x + 'px;top:' + n.y + 'px;width:' + n.w + 'px'; h.textContent = n.t; mundo.appendChild(h); }
DADOS.quadros.forEach((q, i) => {
  const el = document.createElement('section');
  el.className = 'quadro'; el.dataset.i = i; el.dataset.id = q.id;
  el.style.cssText = 'left:' + q.x + 'px;top:' + q.y + 'px;width:' + q.w + 'px;height:' + q.h + 'px;border-radius:' + q.r + 'px';
  const rot = document.createElement('span'); rot.className = 'rotulo'; rot.textContent = q.t; el.appendChild(rot);
  const tela = document.createElement('div'); tela.style.cssText = 'width:100%;height:100%;overflow:hidden;border-radius:inherit;position:relative';
  el.appendChild(tela); el._tela = tela; mundo.appendChild(el); quadros.push(el);
});
// each board is drawn in its own shadow root when it gets near the screen, so styles never mix
function desenhar(el) {
  if (el._feito) return; el._feito = true;
  const q = DADOS.quadros[+el.dataset.i];
  const raiz = el._tela.attachShadow({ mode: 'open' });
  raiz.innerHTML = '<style>:host{display:block;width:100%;height:100%;overflow:hidden;color:#111513;font-family:Manrope,system-ui,sans-serif;-webkit-user-select:none;user-select:none}button{font-family:inherit}</style><style>' + q.css + '</style>' + q.html;
  for (const b of raiz.querySelectorAll('button')) {
    const r = b.getAttribute('aria-label') || b.textContent.trim();
    const a = DADOS.alvos.find(([re]) => new RegExp(re).test(r));
    if (a) { b.dataset.alvo = a[1]; b.style.cursor = 'pointer'; }
  }
}
const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { desenhar(e.target); obs.unobserve(e.target); } }), { rootMargin: '600px' });
quadros.forEach(q => obs.observe(q));

let z = 1, px = 0, py = 0, atual = -1, volta = null;
const limita = v => Math.min(3, Math.max(0.03, v));
function aplicar() { mundo.style.transform = 'translate(' + px + 'px,' + py + 'px) scale(' + z + ')'; document.getElementById('nivel').textContent = Math.round(z * 100) + '%'; }
function zoomEm(cx, cy, f) { const nz = limita(z * f); px = cx - (cx - px) * (nz / z); py = cy - (cy - py) * (nz / z); z = nz; aplicar(); }
function caixaDe(els) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  els.forEach(q => { x0 = Math.min(x0, q.offsetLeft); y0 = Math.min(y0, q.offsetTop); x1 = Math.max(x1, q.offsetLeft + q.offsetWidth); y1 = Math.max(y1, q.offsetTop + q.offsetHeight); });
  return { x0, y0, x1, y1 };
}
function enquadrar(b, folga) {
  const W = vista.clientWidth, H = vista.clientHeight - 130;
  z = limita(Math.min((W - folga * 2) / (b.x1 - b.x0), (H - folga * 2) / (b.y1 - b.y0)));
  px = (W - (b.x1 - b.x0) * z) / 2 - b.x0 * z; py = 64 + (H - (b.y1 - b.y0) * z) / 2 - b.y0 * z; aplicar();
}
const todos = () => [...quadros, ...mundo.querySelectorAll('.titulo-linha')];
function verTudo() { atual = -1; enquadrar(caixaDe(todos()), 30); }
function inicio() {
  atual = -1;
  const b = caixaDe(todos()), W = vista.clientWidth;
  z = limita(Math.min(1, (W - 80) / (b.x1 - b.x0))); px = (W - (b.x1 - b.x0) * z) / 2 - b.x0 * z; py = 76 - b.y0 * z; aplicar();
}
function focar(i, semHash) {
  if (!quadros.length) return;
  atual = (i + quadros.length) % quadros.length;
  const q = quadros[atual];
  enquadrar({ x0: q.offsetLeft, y0: q.offsetTop - 40, x1: q.offsetLeft + q.offsetWidth, y1: q.offsetTop + Math.min(q.offsetHeight, 1000) }, 24);
  if (!semHash) history.replaceState(null, '', '#' + q.dataset.id);
}
const focarId = id => { const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i); };

// pan, pinch, no text selection
let ponteiros = new Map(), moveu = 0, d0 = 0, z0 = 1;
vista.addEventListener('selectstart', e => e.preventDefault());
vista.addEventListener('dragstart', e => e.preventDefault());
vista.addEventListener('pointerdown', e => { if (e.button === 0) e.preventDefault(); ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY }); moveu = 0; vista.classList.add('arrastando');
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = z; } });
vista.addEventListener('pointermove', e => {
  const p = ponteiros.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomEm((a.x + b.x) / 2, (a.y + b.y) / 2, (z0 * d / d0) / z); moveu += 10; return; }
  moveu += Math.abs(dx) + Math.abs(dy); px += dx; py += dy; aplicar();
  if (moveu > 4 && !vista.hasPointerCapture(e.pointerId)) vista.setPointerCapture(e.pointerId);
});
const solta = e => { ponteiros.delete(e.pointerId); if (!ponteiros.size) vista.classList.remove('arrastando'); };
vista.addEventListener('pointerup', solta); vista.addEventListener('pointercancel', solta);
vista.addEventListener('click', e => {
  if (moveu > 5) return;
  const alvo = e.composedPath().find(n => n.dataset && n.dataset.alvo);
  if (!alvo) return;
  e.preventDefault();
  const q = quadros[atual];
  if (alvo.dataset.alvo === 'voltar') { if (volta) focarId(volta); return; }
  if (q && !q.dataset.id.startsWith('Folha')) volta = q.dataset.id;
  focarId(alvo.dataset.alvo);
});
vista.addEventListener('dblclick', e => { const q = e.target.closest('.quadro'); if (q) focar(+q.dataset.i); });
vista.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomEm(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022)); else { px -= e.deltaX; py -= e.deltaY; aplicar(); } }, { passive: false });
const centro = () => [vista.clientWidth / 2, vista.clientHeight / 2];
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomEm(...centro(), 1.25); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); zoomEm(...centro(), 0.8); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); verTudo(); }
  else if (e.key === 'ArrowRight') focar(atual + 1);
  else if (e.key === 'ArrowLeft') focar(atual < 0 ? quadros.length - 1 : atual - 1);
  else if (e.key === 'Escape') verTudo();
});
document.getElementById('mais').onclick = () => zoomEm(...centro(), 1.25);
document.getElementById('menos').onclick = () => zoomEm(...centro(), 0.8);
document.getElementById('ajustar').onclick = verTudo;
document.getElementById('proxima').onclick = () => focar(atual + 1);
document.getElementById('anterior').onclick = () => focar(atual < 0 ? quadros.length - 1 : atual - 1);
// a row title is one line, as in the canvas: a longer text shrinks to fit its width
function ajustarTitulos() { for (const h of mundo.querySelectorAll('.titulo-linha')) { h.style.fontSize = '72px'; h.style.lineHeight = '84px'; const w = parseFloat(h.style.width); if (h.scrollWidth > w) { const f = Math.max(20, 72 * w / h.scrollWidth); h.style.fontSize = f + 'px'; h.style.lineHeight = Math.round(f * 1.17) + 'px'; } } }
function abrir() { const id = decodeURIComponent(location.hash.slice(1)); const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i, true); else inicio(); }
window.addEventListener('resize', () => atual < 0 ? inicio() : focar(atual, true));
window.addEventListener('hashchange', abrir);
ajustarTitulos();
abrir();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ajustarTitulos(); if (atual < 0) inicio(); });
</script>
