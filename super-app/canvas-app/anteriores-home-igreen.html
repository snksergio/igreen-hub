const vista = document.getElementById('vista'), mundo = document.getElementById('mundo');
const quadros = [];

  el.style.cssText = 'left:' + q.x + 'px;top:' + q.y + 'px;width:' + q.w + 'px;height:' + q.h + 'px;border-radius:' + q.r + 'px';

function desenhar(el) {

  raiz.innerHTML = '<style>:host{display:block;width:100%;height:100%;overflow:hidden;color:#111513;font-family:Manrope,system-ui,sans-serif;-webkit-user-select:none;user-select:none}button{font-family:inherit}</style><style>' + q.css + '</style>' + q.html;

}
const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { desenhar(e.target); obs.unobserve(e.target); } }), { rootMargin: '600px' });

let z = 1, px = 0, py = 0, atual = -1, volta = null;
const limita = v => Math.min(3, Math.max(0.03, v));

function zoomEm(cx, cy, f) { const nz = limita(z * f); px = cx - (cx - px) * (nz / z); py = cy - (cy - py) * (nz / z); z = nz; aplicar(); }

}

  if (!semHash) history.replaceState(null, '', '#' + q.dataset.id);
}
const focarId = id => { const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i); };

let ponteiros = new Map(), moveu = 0, d0 = 0, z0 = 1;

  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = z; } });

  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomEm((a.x + b.x) / 2, (a.y + b.y) / 2, (z0 * d / d0) / z); moveu += 10; return; }
  moveu += Math.abs(dx) + Math.abs(dy); px += dx; py += dy; aplicar();

vista.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomEm(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022)); else { px -= e.deltaX; py -= e.deltaY; aplicar(); } }, { passive: false });
const centro = () => [vista.clientWidth / 2, vista.clientHeight / 2];
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomEm(...centro(), 1.25); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); zoomEm(...centro(), 0.8); }

});

document.getElementById('anterior').onclick = () => focar(atual < 0 ? quadros.length - 1 : atual - 1);
// a row title is one line, as in the canvas: a longer text shrinks to fit its width
function ajustarTitulos() { for (const h of mundo.querySelectorAll('.titulo-linha')) { h.style.fontSize = '72px'; h.style.lineHeight = '84px'; const w = parseFloat(h.style.width); if (h.scrollWidth > w) { const f = Math.max(20, 72 * w / h.scrollWidth); h.style.fontSize = f + 'px'; h.style.lineHeight = Math.round(f * 1.17) + 'px'; } } }
function abrir() { const id = decodeURIComponent(location.hash.slice(1)); const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i, true); else inicio(); }
window.addEventListener('resize', () => atual < 0 ? inicio() : focar(atual, true));
window.addEventListener('hashchange', abrir);
ajustarTitulos();
abrir();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ajustarTitulos(); if (atual < 0) inicio(); });
</script>
</body>
</html>
