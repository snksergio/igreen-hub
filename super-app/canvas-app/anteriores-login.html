});
// each board is drawn in its own shadow root when it gets near the screen, so styles never mix
function desenhar(el) {

  const q = DADOS.quadros[+el.dataset.i];

  raiz.innerHTML = '<style>:host{display:block;width:100%;height:100%;overflow:hidden;color:#111513;font-family:Manrope,system-ui,sans-serif;-webkit-user-select:none;user-select:none}button{font-family:inherit}</style><style>' + q.css + '</style>' + q.html;

    if (a) { b.dataset.alvo = a[1]; b.style.cursor = 'pointer'; }
  }
}
const obs = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { desenhar(e.target); obs.unobserve(e.target); } }), { rootMargin: '600px' });
quadros.forEach(q => obs.observe(q));

let z = 1, px = 0, py = 0, atual = -1, volta = null;
const limita = v => Math.min(3, Math.max(0.03, v));
function aplicar() { mundo.style.transform = 'translate(' + px + 'px,' + py + 'px) scale(' + z + ')'; document.getElementById('nivel').textContent = Math.round(z * 100) + '%'; }
function zoomEm(cx, cy, f) { const nz = limita(z * f); px = cx - (cx - px) * (nz / z); py = cy - (cy - py) * (nz / z); z = nz; aplicar(); }
function caixaDe(els) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;

}
function enquadrar(b, folga) {
  const W = vista.clientWidth, H = vista.clientHeight - 130;
  z = limita(Math.min((W - folga * 2) / (b.x1 - b.x0), (H - folga * 2) / (b.y1 - b.y0)));
  px = (W - (b.x1 - b.x0) * z) / 2 - b.x0 * z; py = 64 + (H - (b.y1 - b.y0) * z) / 2 - b.y0 * z; aplicar();
}
const todos = () => [...quadros, ...mundo.querySelectorAll('.titulo-linha')];
function verTudo() { atual = -1; enquadrar(caixaDe(todos()), 30); }
function inicio() {
  atual = -1;
  const b = caixaDe(todos()), W = vista.clientWidth;
  z = limita(Math.min(1, (W - 80) / (b.x1 - b.x0))); px = (W - (b.x1 - b.x0) * z) / 2 - b.x0 * z; py = 76 - b.y0 * z; aplicar();
}
function focar(i, semHash) {
  if (!quadros.length) return;
  atual = (i + quadros.length) % quadros.length;
  const q = quadros[atual];
  enquadrar({ x0: q.offsetLeft, y0: q.offsetTop - 40, x1: q.offsetLeft + q.offsetWidth, y1: q.offsetTop + Math.min(q.offsetHeight, 1000) }, 24);
  if (!semHash) history.replaceState(null, '', '#' + q.dataset.id);
}
const focarId = id => { const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i); };

// pan, pinch, no text selection
let ponteiros = new Map(), moveu = 0, d0 = 0, z0 = 1;
vista.addEventListener('selectstart', e => e.preventDefault());

  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = z; } });
vista.addEventListener('pointermove', e => {
  const p = ponteiros.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomEm((a.x + b.x) / 2, (a.y + b.y) / 2, (z0 * d / d0) / z); moveu += 10; return; }
  moveu += Math.abs(dx) + Math.abs(dy); px += dx; py += dy; aplicar();
  if (moveu > 4 && !vista.hasPointerCapture(e.pointerId)) vista.setPointerCapture(e.pointerId);
});
const solta = e => { ponteiros.delete(e.pointerId); if (!ponteiros.size) vista.classList.remove('arrastando'); };
vista.addEventListener('pointerup', solta); vista.addEventListener('pointercancel', solta);
vista.addEventListener('click', e => {
  if (moveu > 5) return;
  const alvo = e.composedPath().find(n => n.dataset && n.dataset.alvo);
  if (!alvo) return;
  e.preventDefault();
  const q = quadros[atual];
  if (alvo.dataset.alvo === 'voltar') { if (volta) focarId(volta); return; }
  if (q && !q.dataset.id.startsWith('Folha')) volta = q.dataset.id;
  focarId(alvo.dataset.alvo);
});
vista.addEventListener('dblclick', e => { const q = e.target.closest('.quadro'); if (q) focar(+q.dataset.i); });
vista.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomEm(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022)); else { px -= e.deltaX; py -= e.deltaY; aplicar(); } }, { passive: false });
const centro = () => [vista.clientWidth / 2, vista.clientHeight / 2];
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomEm(...centro(), 1.25); }

document.getElementById('menos').onclick = () => zoomEm(...centro(), 0.8);

// a row title is one line, as in the canvas: a longer text shrinks to fit its width
function ajustarTitulos() { for (const h of mundo.querySelectorAll('.titulo-linha')) { h.style.fontSize = '72px'; h.style.lineHeight = '84px'; const w = parseFloat(h.style.width); if (h.scrollWidth > w) { const f = Math.max(20, 72 * w / h.scrollWidth); h.style.fontSize = f + 'px'; h.style.lineHeight = Math.round(f * 1.17) + 'px'; } } }
function abrir() { const id = decodeURIComponent(location.hash.slice(1)); const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i, true); else inicio(); }
