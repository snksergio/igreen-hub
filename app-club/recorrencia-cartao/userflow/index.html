ht:100%;object-fit:cover\">","css":""},{"id":"rec-home-4","x":5950,"y":4910,"w":390,"h":844,"t":"4 · Cartão vencido ou bloqueado","r":32,"html":"<img src=\"assets/rec-home-4.webp\" alt=\"\" draggable=\"false\" style=\"display:block;width:100%;height:100%;object-fit:cover\">","css":""}],"titulos":[{"x":0,"y":-40,"w":3090,"t":"Primeiro pagamento no cartão","d":"Sem cartão principal, nada vem escolhido. Escolher o cartão só escolhe. Ao pagar com ele, uma folha antes do pagamento empurra a recorrência (\"Não esqueça mais a conta de luz\"), com as outras escolhas ao lado. Ativada, a confirmação mostra o card verde com o interruptor para desligar.","g":"Pagar e ativar a recorrência"},{"x":0,"y":1420,"w":2010,"t":"Só pagar esta fatura","d":"Quem escolhe só pagar vê, na confirmação, o card da recorrência com o interruptor e o \"?\" de como funciona. Ligar abre a folha para escolher o cartão.","g":""},{"x":0,"y":2880,"w":2010,"t":"Com cartão principal","d":"Com um cartão principal, a fatura fica curta: só ele, já escolhido. Ela não oferece ativar a recorrência ali: quem oferece é a folha antes de pagar, com quanto esta fatura sairia mais barata. Ativa, a fatura mostra a linha \"Recorrência ativa\" e o botão vira \"Adiantar pagamento\". \"Ver outras formas de pagamento\" abre o resto no lugar.","g":""},{"x":0,"y":4340,"w":3630,"t":"Adicionar cartão na fatura","d":"Primeiro o tipo, numa lista simples. Depois o número: a bandeira aparece enquanto ele digita e, completo, o campo carrega sozinho e o nome, a validade e o CVV abrem juntos, sem Continuar. Toque no campo do número para digitar. Na fatura, salvar volta direto para o pagamento.","g":""},{"x":0,"y":5800,"w":3630,"t":"Adicionar em Perfil › Pagamentos","d":"Fora do pagamento, antes de salvar, uma folha pergunta como usar o cartão: ativar a recorrência (recomendado), usar como principal ou só salvar.","g":""},{"x":0,"y":7260,"w":2550,"t":"Vários cartões","d":"Nas outras formas de pagamento, até dois cartões, o principal e o mais usado. \"Ver todos os cartões\" abre o resto ali mesmo. \"Gerenciar cartões\" leva às opções de cada um.","g":""},{"x":0,"y":8720,"w":3090,"t":"Em Perfil › Pagamentos","d":"A casa fica no topo, no mesmo seletor das faturas, e a recorrência ganha um card só dela: o mesmo das faturas, com os 5% do cartão na próxima fatura. Ligar abre a folha com o cartão.","g":""},{"x":0,"y":10180,"w":1800,"t":"Como funciona","d":"O banner das faturas abre como funciona: a ilustração, o ganho no título e os passos. O botão do banner liga a recorrência. Na fatura, o \"?\" do card faz o mesmo.","g":""},{"x":4330,"y":-40,"w":2550,"t":"Fatura em aberto na recorrência","d":"A fatura de outubro, em aberto, entra na recorrência e não atrasa. No card dela, em cima do botão, só \"Pagamento automático ativado\", e o botão vira \"Adiantar pagamento\". Dois dias antes, a notificação traz o valor. Cobrada, ela vai para as pagas com uma bolinha da recorrência no ícone do cartão.","g":"Com a recorrência ativa"},{"x":4330,"y":1420,"w":3090,"t":"Cartão recusado: sem limite","d":"Recusa temporária, em destaque: tentamos de novo em 09/10 e 10/10, antes do vencimento. \"Trocar cartão e pagar\" cobra na hora e mantém os 5% desta fatura.","g":""},{"x":4330,"y":2880,"w":2010,"t":"Cartão vencido ou bloqueado","d":"Recusa definitiva, sem novas tentativas: o destaque pede outro cartão até o vencimento, e dá para pagar agora por Pix, boleto ou cartão.","g":""},{"x":8120,"y":-40,"w":2010,"t":"Trocar o cartão da recorrência","d":"Na recorrência, em Ações. Vale a partir da próxima cobrança. O CVV é pedido de novo, porque a troca abre uma nova série de cobranças no cartão.","g":"Gerenciar"},{"x":8120,"y":1420,"w":1800,"t":"Desativar","d":"O interruptor desliga, e uma folha pergunta antes: o pagamento volta a ser manual, e a fatura de outubro não será cobrada no cartão.","g":""},{"x":8120,"y":2880,"w":2550,"t":"Opções do cartão","d":"Tocar num cartão abre uma lista de opções: apelido, principal, usar na recorrência e remover. O cartão da recorrência só sai depois de trocar o cartão dela.","g":""},{"x":8120,"y":4340,"w":1800,"t":"Cartão atualizado sozinho","d":"O cartão venceu e o banco mandou a nova validade: ele é atualizado sem o cliente fazer nada, e o app avisa. A recorrência continua igual.","g":""},{"x":4330,"y":4600,"w":2010,"t":"Home de energia","d":"O card de outubro em \"Minhas faturas\", na Energia, nos quatro estados da recorrência: desligada, ativa (a faixa \"Pagamento automático ativado\" e \"Adiantar pagamento\"), cobrança recusada e cartão bloqueado (o alerta laranja cheio, com \"Trocar o cartão\", e \"Efetuar pagamento manual\"). Role até \"Minhas faturas\".","g":"Na home (Energia)"}],"alvos":[],"setas":[["rec-pagar-1","rec-pagar-2"],["rec-pagar-2","rec-pagar-3"],["rec-pagar-3","rec-pagar-4"],["rec-pagar-4","rec-pagar-5"],["rec-pagar-5","rec-pagar-6"],["rec-so-pagar-1","rec-so-pagar-2"],["rec-so-pagar-2","rec-so-pagar-3"],["rec-so-pagar-3","rec-so-pagar-4"],["rec-principal-1","rec-principal-2"],["rec-principal-2","rec-principal-3"],["rec-principal-3","rec-principal-4"],["rec-sem-cartao-1","rec-sem-cartao-2"],["rec-sem-cartao-2","rec-sem-cartao-3"],["rec-sem-cartao-3","rec-sem-cartao-4"],["rec-sem-cartao-4","rec-sem-cartao-5"],["rec-sem-cartao-5","rec-sem-cartao-6"],["rec-sem-cartao-6","rec-sem-cartao-7"],["rec-add-perfil-1","rec-add-perfil-2"],["rec-add-perfil-2","rec-add-perfil-3"],["rec-add-perfil-3","rec-add-perfil-4"],["rec-add-perfil-4","rec-add-perfil-5"],["rec-add-perfil-5","rec-add-perfil-6"],["rec-add-perfil-6","rec-add-perfil-7"],["rec-varios-1","rec-varios-2"],["rec-varios-2","rec-varios-3"],["rec-varios-3","rec-varios-4"],["rec-varios-4","rec-varios-5"],["rec-perfil-1","rec-perfil-2"],["rec-perfil-2","rec-perfil-3"],["rec-perfil-3","rec-perfil-4"],["rec-perfil-4","rec-perfil-5"],["rec-perfil-5","rec-perfil-6"],["rec-como-1","rec-como-2"],["rec-aviso-1","rec-aviso-2"],["rec-aviso-2","rec-aviso-3"],["rec-aviso-3","rec-aviso-4"],["rec-aviso-4", // each board is drawn in its own shadow root when it gets near the screen, so styles never mix
function desenhar(el) {

  const q = DADOS.quadros[+el.dataset.i];
  const raiz = el._tela.attachShadow({ mode: 'open' });

let z = 1, px = 0, py = 0, atual = -1, volta = null;

vista.addEventListener('dragstart', e => e.preventDefault());
vista.addEventListener('pointerdown', e => { if (e.button === 0) e.preventDefault(); ponteiros.set(e.pointerId, { x: e.clientX, y: e.clientY }); moveu = 0; vista.classList.add('arrastando');
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; d0 = Math.hypot(a.x - b.x, a.y - b.y); z0 = z; } });
vista.addEventListener('pointermove', e => {
  const p = ponteiros.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (ponteiros.size === 2) { const [a, b] = [...ponteiros.values()]; const d = Math.hypot(a.x - b.x, a.y - b.y); zoomEm((a.x + b.x) / 2, (a.y + b.y) / 2, (z0 * d / d0) / z); moveu += 10; return; }
  moveu += Math.abs(dx) + Math.abs(dy); px += dx; py += dy; aplicar();
  if (moveu > 4 && !vista.hasPointerCapture(e.pointerId)) vista.setPointerCapture(e.pointerId);
});
const solta = e => { ponteiros.delete(e.pointerId); if (!ponteiros.size) vista.classList.remove('arrastando'); };
vista.addEventListener('pointerup', solta); vista.addEventListener('pointercancel', solta);
vista.addEventListener('click', e => {
  if (moveu > 5) return;
  const alvo = e.composedPath().find(n => n.dataset && n.dataset.alvo);
  if (!alvo) return;
  e.preventDefault();
  const q = quadros[atual];
  if (alvo.dataset.alvo === 'voltar') { if (volta) focarId(volta); return; }
  if (q && !q.dataset.id.startsWith('Folha')) volta = q.dataset.id;
  focarId(alvo.dataset.alvo);
});
vista.addEventListener('dblclick', e => { const q = e.target.closest('.quadro'); if (q) focar(+q.dataset.i); });
vista.addEventListener('wheel', e => { e.preventDefault(); if (e.ctrlKey || e.metaKey) zoomEm(e.clientX, e.clientY, Math.exp(-e.deltaY * 0.0022)); else { px -= e.deltaX; py -= e.deltaY; aplicar(); } }, { passive: false });
const centro = () => [vista.clientWidth / 2, vista.clientHeight / 2];
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && (e.key === '=' || e.key === '+')) { e.preventDefault(); zoomEm(...centro(), 1.25); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '-') { e.preventDefault(); zoomEm(...centro(), 0.8); }
  else if ((e.ctrlKey || e.metaKey) && e.key === '0') { e.preventDefault(); verTudo(); }
  else if (e.key === 'ArrowRight') focar(atual + 1);
  else if (e.key === 'ArrowLeft') focar(atual < 0 ? quadros.length - 1 : atual - 1);
  else if (e.key === 'Escape') verTudo();
});
document.getElementById('mais').onclick = () => zoomEm(...centro(), 1.25);
document.getElementById('menos').onclick = () => zoomEm(...centro(), 0.8);
document.getElementById('ajustar').onclick = verTudo;
document.getElementById('proxima').onclick = () => focar(atual + 1);
document.getElementById('anterior').onclick = () => focar(atual < 0 ? quadros.length - 1 : atual - 1);
// a row title is one line, as in the canvas: a longer text shrinks to fit its width
function ajustarTitulos() { for (const h of mundo.querySelectorAll('.titulo-linha')) { h.style.fontSize = '72px'; h.style.lineHeight = '84px'; const w = parseFloat(h.style.width); if (h.scrollWidth > w) { const f = Math.max(20, 72 * w / h.scrollWidth); h.style.fontSize = f + 'px'; h.style.lineHeight = Math.round(f * 1.17) + 'px'; } } }
function abrir() { const id = decodeURIComponent(location.hash.slice(1)); const i = quadros.findIndex(q => q.dataset.id === id); if (i >= 0) focar(i, true); else inicio(); }
window.addEventListener('resize', () => atual < 0 ? inicio() : focar(atual, true));
window.addEventListener('hashchange', abrir);
ajustarTitulos();
abrir();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { ajustarTitulos(); if (atual < 0) inicio(); });
</script>
</body>
</html>
